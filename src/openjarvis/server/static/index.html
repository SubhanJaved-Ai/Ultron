<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
  <meta name="theme-color" content="#02050c">
  <meta name="description" content="ULTRON Autonomous AI — Minimal Glowing Electron Core & Real-Time Voice Assistant">
  <link rel="manifest" href="/manifest.webmanifest">
  <title>ULTRON — Quantum Electron Core (Jarvis 2.0)</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700&family=Orbitron:wght@600;800;900&display=swap" rel="stylesheet">
  <!-- Three.js local library -->
  <script src="/three.min.js"></script>
  <style>
    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }
    :root {
      --bg: #06080e;
      --glass-panel: rgba(15, 23, 42, 0.72);
      --glass-card: rgba(18, 26, 44, 0.65);
      --glass-border: rgba(255, 255, 255, 0.12);
      --glass-border-hover: rgba(255, 255, 255, 0.22);
      --glass-shadow: 0 20px 48px -8px rgba(0, 0, 0, 0.6), inset 0 1px 1px rgba(255, 255, 255, 0.16);
      --text-primary: #f8fafc;
      --text-secondary: #94a3b8;
      --text-muted: #64748b;
      --accent-cyan: #38bdf8;
      --accent-cyan-dim: rgba(56, 189, 248, 0.18);
      --accent-amber: #f59e0b;
      --accent-amber-dim: rgba(245, 158, 11, 0.18);
      --accent-emerald: #10b981;
      --accent-emerald-dim: rgba(16, 185, 129, 0.18);
      --accent-violet: #818cf8;
      --accent-violet-dim: rgba(129, 140, 248, 0.18);

      /* Backward compatibility tokens */
      --cyan: #38bdf8;
      --cyan-bright: #7dd3fc;
      --cyan-dim: rgba(56, 189, 248, 0.2);
      --yellow: #f59e0b;
      --yellow-bright: #fbbf24;
      --yellow-dim: rgba(245, 158, 11, 0.2);
      --green: #10b981;
      --green-bright: #34d399;
      --green-dim: rgba(16, 185, 129, 0.2);
      --purple: #818cf8;
      --text: #f8fafc;
      --muted: #94a3b8;
    }
    body {
      background: var(--bg);
      color: var(--text-primary);
      font-family: 'Inter', -apple-system, BlinkMacSystemFont, 'SF Pro Text', sans-serif;
      min-height: 100vh;
      overflow: hidden;
      user-select: none;
      -webkit-font-smoothing: antialiased;
    }

    /* 3D WebGL Canvas Layer */
    #hologram-canvas {
      position: fixed;
      top: 0;
      left: 0;
      width: 100vw;
      height: 100vh;
      z-index: 1;
      display: block;
    }

    /* Subtle Cinematic Vignette */
    .vignette-overlay {
      position: fixed;
      top: 0;
      left: 0;
      width: 100vw;
      height: 100vh;
      z-index: 2;
      pointer-events: none;
      background: radial-gradient(circle at center, transparent 40%, rgba(6, 8, 14, 0.9) 100%);
    }

    /* Minimal UI Overlay */
    .minimal-hud {
      position: fixed;
      top: 0;
      left: 0;
      width: 100vw;
      height: 100vh;
      z-index: 10;
      pointer-events: none;
      display: flex;
      flex-direction: column;
      justify-content: space-between;
      padding: 20px 28px;
    }

    /* Top Floating Header Bar (Apple Glass Pill) */
    .hud-header {
      display: flex;
      justify-content: space-between;
      align-items: center;
      pointer-events: auto;
      padding: 8px 18px;
      background: rgba(15, 23, 42, 0.55);
      backdrop-filter: blur(28px) saturate(190%);
      -webkit-backdrop-filter: blur(28px) saturate(190%);
      border: 1px solid rgba(255, 255, 255, 0.1);
      border-radius: 9999px;
      box-shadow: 0 10px 30px -5px rgba(0, 0, 0, 0.5), inset 0 1px 1px rgba(255, 255, 255, 0.12);
      max-width: 1200px;
      margin: 0 auto;
      width: 100%;
    }
    .hud-brand {
      display: flex;
      align-items: center;
      gap: 12px;
    }
    .hud-logo {
      font-size: 16px;
      font-weight: 800;
      letter-spacing: 0.14em;
      background: linear-gradient(135deg, #ffffff 40%, #38bdf8 100%);
      -webkit-background-clip: text;
      -webkit-text-fill-color: transparent;
      text-shadow: 0 0 25px rgba(56, 189, 248, 0.35);
    }
    .hud-sublogo {
      font-size: 10.5px;
      font-weight: 500;
      letter-spacing: 0.08em;
      color: var(--text-muted);
      border-left: 1px solid rgba(255, 255, 255, 0.12);
      padding-left: 10px;
    }

    /* Dynamic Center Status Pill */
    .status-pill {
      font-size: 11px;
      font-weight: 600;
      letter-spacing: 0.08em;
      padding: 6px 14px;
      border-radius: 9999px;
      backdrop-filter: blur(16px);
      -webkit-backdrop-filter: blur(16px);
      transition: all 0.3s cubic-bezier(0.16, 1, 0.3, 1);
      display: flex;
      align-items: center;
      gap: 8px;
      background: rgba(255, 255, 255, 0.05);
      border: 1px solid rgba(255, 255, 255, 0.1);
      color: var(--accent-cyan);
    }
    .status-pill.standby {
      color: var(--accent-cyan);
      background: rgba(56, 189, 248, 0.08);
      border-color: rgba(56, 189, 248, 0.25);
    }
    .status-pill.listening {
      color: var(--accent-amber);
      background: var(--accent-amber-dim);
      border-color: var(--accent-amber);
      box-shadow: 0 0 24px rgba(245, 158, 11, 0.35);
    }
    .status-pill.thinking {
      color: var(--accent-violet);
      background: var(--accent-violet-dim);
      border-color: var(--accent-violet);
      box-shadow: 0 0 24px rgba(129, 140, 248, 0.35);
    }
    .status-pill.speaking {
      color: var(--accent-emerald);
      background: var(--accent-emerald-dim);
      border-color: var(--accent-emerald);
      box-shadow: 0 0 24px rgba(16, 185, 129, 0.35);
    }
    .status-dot {
      width: 6px;
      height: 6px;
      border-radius: 50%;
      background: currentColor;
      box-shadow: 0 0 8px currentColor;
    }

    /* Audio Neural Unlock Banner */
    .audio-unlock-banner {
      position: absolute;
      top: 76px;
      left: 50%;
      transform: translateX(-50%);
      background: rgba(15, 23, 42, 0.65);
      border: 1px solid rgba(56, 189, 248, 0.3);
      box-shadow: 0 10px 25px rgba(0, 0, 0, 0.4), inset 0 1px 1px rgba(255, 255, 255, 0.15);
      border-radius: 9999px;
      padding: 6px 18px;
      font-size: 10px;
      font-weight: 600;
      letter-spacing: 0.1em;
      color: var(--accent-cyan);
      cursor: pointer;
      pointer-events: auto;
      display: flex;
      align-items: center;
      gap: 8px;
      backdrop-filter: blur(20px);
      -webkit-backdrop-filter: blur(20px);
      transition: all 0.3s ease;
    }
    .audio-unlock-banner.unlocked {
      border-color: rgba(16, 185, 129, 0.4);
      color: var(--accent-emerald);
      background: rgba(16, 185, 129, 0.1);
    }

    /* Central Interactive Core Reticle - Concentric and Snug INSIDE 3D Nucleus Ball */
    .core-reticle-stage {
      position: absolute;
      top: 50%;
      left: 50%;
      transform: translate(-50%, -50%);
      width: 38px;
      height: 38px;
      pointer-events: auto;
      cursor: pointer;
      z-index: 15;
      display: flex;
      align-items: center;
      justify-content: center;
      transition: transform 0.2s ease;
    }
    .reticle-ring {
      position: absolute;
      width: 32px;
      height: 32px;
      border-radius: 50%;
      border: 1px dashed rgba(56, 189, 248, 0.45);
      box-shadow: 0 0 6px rgba(56, 189, 248, 0.25), inset 0 0 4px rgba(56, 189, 248, 0.2);
      transition: all 0.4s cubic-bezier(0.16, 1, 0.3, 1);
      animation: spin-slow 28s linear infinite;
    }
    .reticle-ring.listening {
      border-color: var(--accent-amber);
      border-style: solid;
      box-shadow: 0 0 12px rgba(245, 158, 11, 0.6), inset 0 0 6px rgba(245, 158, 11, 0.35);
      animation: spin-fast 8s linear infinite;
    }
    .reticle-ring.speaking {
      border-color: var(--accent-emerald);
      border-style: solid;
      box-shadow: 0 0 12px rgba(16, 185, 129, 0.6), inset 0 0 6px rgba(16, 185, 129, 0.35);
      animation: spin-fast 6s linear infinite;
    }
    @keyframes spin-slow {
      from { transform: rotate(0deg); }
      to { transform: rotate(360deg); }
    }
    @keyframes spin-fast {
      from { transform: rotate(0deg); }
      to { transform: rotate(360deg); }
    }

    /* Apple VisionOS Dynamic Spatial Glass Response Capsule - Ultra-Sleek & Low-Profile */
    .response-glass-card {
      position: absolute;
      bottom: 58px;
      left: 50%;
      transform: translateX(-50%);
      width: 90%;
      max-width: 480px;
      background: rgba(15, 23, 42, 0.70);
      backdrop-filter: blur(28px) saturate(180%);
      -webkit-backdrop-filter: blur(28px) saturate(180%);
      border: 1px solid rgba(255, 255, 255, 0.12);
      box-shadow: 0 10px 24px -6px rgba(0, 0, 0, 0.6), inset 0 1px 1px 0 rgba(255, 255, 255, 0.14);
      border-radius: 14px;
      padding: 6px 14px;
      display: flex;
      flex-direction: column;
      gap: 3px;
      transition: all 0.35s cubic-bezier(0.16, 1, 0.3, 1);
      pointer-events: auto;
      cursor: default;
      z-index: 25;
      max-height: 72px;
    }
    .response-glass-card.listening {
      border-color: rgba(245, 158, 11, 0.45);
      box-shadow: 0 10px 24px -6px rgba(0, 0, 0, 0.6), 0 0 18px rgba(245, 158, 11, 0.2);
    }
    .response-glass-card.speaking {
      border-color: rgba(16, 185, 129, 0.45);
      box-shadow: 0 10px 24px -6px rgba(0, 0, 0, 0.6), 0 0 18px rgba(16, 185, 129, 0.25);
    }
    .response-card-header {
      display: flex;
      align-items: center;
      justify-content: space-between;
      padding-bottom: 2px;
      border-bottom: 1px solid rgba(255, 255, 255, 0.08);
    }
    .response-speaker-badge {
      display: flex;
      align-items: center;
      gap: 6px;
      font-size: 9.5px;
      font-weight: 700;
      letter-spacing: 0.08em;
      color: var(--accent-cyan);
      text-transform: uppercase;
    }
    .response-pulse-dot {
      width: 5px;
      height: 5px;
      border-radius: 50%;
      background: currentColor;
      box-shadow: 0 0 8px currentColor;
    }
    .response-card-actions {
      display: flex;
      align-items: center;
      gap: 5px;
    }
    .response-glass-btn {
      background: rgba(255, 255, 255, 0.06);
      border: 1px solid rgba(255, 255, 255, 0.1);
      color: var(--text-secondary);
      border-radius: 8px;
      padding: 2px 7px;
      font-size: 9px;
      font-weight: 500;
      cursor: pointer;
      display: flex;
      align-items: center;
      gap: 3px;
      transition: all 0.2s ease;
    }
    .response-glass-btn:hover {
      background: rgba(255, 255, 255, 0.14);
      color: #ffffff;
      border-color: rgba(255, 255, 255, 0.25);
    }

    /* Scrollable Subtitle Stream: Sleek Capsule Stream, Never Obstructs Ball */
    .subtitle-stream {
      max-height: 38px;
      overflow-y: auto;
      overflow-x: hidden;
      padding-right: 4px;
      font-size: 11.5px;
      line-height: 1.4;
      letter-spacing: 0.01em;
      color: var(--text-primary);
      text-align: left;
      word-break: break-word;
      scrollbar-width: thin;
      scrollbar-color: rgba(255, 255, 255, 0.2) transparent;
      transition: color 0.3s ease;
    }
    .subtitle-stream::-webkit-scrollbar {
      width: 3px;
    }
    .subtitle-stream::-webkit-scrollbar-thumb {
      background: rgba(255, 255, 255, 0.2);
      border-radius: 3px;
    }
    .subtitle-stream.listening {
      color: #fde68a;
    }
    .subtitle-stream.speaking {
      color: #ecfdf5;
    }
    .subtitle-hint {
      font-size: 10.5px;
      color: var(--text-muted);
      letter-spacing: 0.04em;
      text-align: center;
      display: block;
      padding: 2px 0;
    }

    /* Audio Equalizer Spectrum */
    .spectrum-bars {
      display: flex;
      gap: 3px;
      align-items: center;
      justify-content: center;
      height: 6px;
      margin-top: 1px;
    }
    .spectrum-bar {
      width: 2.5px;
      height: 2.5px;
      border-radius: 1px;
      background: var(--accent-cyan);
      transition: height 0.08s ease, background-color 0.3s;
    }
    .spectrum-bars.listening .spectrum-bar { background: var(--accent-amber); }
    .spectrum-bars.speaking .spectrum-bar { background: var(--accent-emerald); }

    /* Bottom Command Line Pill (Apple VisionOS Floating Bar) */
    .hud-footer {
      display: flex;
      justify-content: center;
      pointer-events: auto;
      width: 100%;
    }
    .directive-form {
      display: flex;
      align-items: center;
      gap: 8px;
      background: rgba(15, 23, 42, 0.72);
      border: 1px solid rgba(255, 255, 255, 0.12);
      border-radius: 9999px;
      padding: 3px 12px;
      backdrop-filter: blur(28px) saturate(190%);
      -webkit-backdrop-filter: blur(28px) saturate(190%);
      width: 100%;
      max-width: 500px;
      box-shadow: 0 14px 32px rgba(0, 0, 0, 0.55), inset 0 1px 1px rgba(255, 255, 255, 0.14);
      transition: all 0.3s cubic-bezier(0.16, 1, 0.3, 1);
    }
    .directive-form:focus-within {
      border-color: rgba(56, 189, 248, 0.5);
      box-shadow: 0 14px 32px rgba(0, 0, 0, 0.55), 0 0 20px rgba(56, 189, 248, 0.25);
    }
    .directive-form.listening {
      border-color: var(--accent-amber);
      box-shadow: 0 0 20px rgba(245, 158, 11, 0.35);
    }
    .directive-form.speaking {
      border-color: var(--accent-emerald);
      box-shadow: 0 0 20px rgba(16, 185, 129, 0.35);
    }
    .mic-btn {
      width: 38px;
      height: 38px;
      border-radius: 50%;
      border: 1px solid rgba(255, 255, 255, 0.12);
      background: rgba(255, 255, 255, 0.06);
      color: var(--text-primary);
      display: flex;
      align-items: center;
      justify-content: center;
      cursor: pointer;
      transition: all 0.25s ease;
      flex-shrink: 0;
    }
    .mic-btn:hover {
      background: rgba(56, 189, 248, 0.2);
      color: var(--accent-cyan);
      border-color: var(--accent-cyan);
    }
    .mic-btn.active {
      background: var(--accent-amber);
      color: #06080e;
      border-color: var(--accent-amber);
      box-shadow: 0 0 20px rgba(245, 158, 11, 0.5);
    }
    .directive-input {
      flex: 1;
      background: transparent;
      border: none;
      color: var(--text-primary);
      font-family: inherit;
      font-size: 13.5px;
      outline: none;
      padding: 8px 4px;
    }
    .directive-input::placeholder {
      color: var(--text-muted);
    }
    .directive-send {
      background: rgba(56, 189, 248, 0.15);
      border: 1px solid rgba(56, 189, 248, 0.3);
      color: var(--accent-cyan);
      border-radius: 20px;
      padding: 8px 18px;
      font-size: 11px;
      font-weight: 600;
      letter-spacing: 0.08em;
      cursor: pointer;
      transition: all 0.2s ease;
    }
    .directive-send:hover {
      background: var(--accent-cyan);
      color: #06080e;
      box-shadow: 0 0 16px rgba(56, 189, 248, 0.4);
    }

    /* 48-Hour Chat History Drawer (macOS Translucent Sidebar) */
    .hud-header-right {
      display: flex;
      align-items: center;
      gap: 10px;
    }
    .chat-toggle-pill {
      background: rgba(255, 255, 255, 0.06);
      border: 1px solid rgba(255, 255, 255, 0.12);
      color: var(--text-primary);
      border-radius: 9999px;
      padding: 6px 14px;
      font-size: 11px;
      font-weight: 500;
      cursor: pointer;
      display: flex;
      align-items: center;
      gap: 6px;
      backdrop-filter: blur(12px);
      -webkit-backdrop-filter: blur(12px);
      transition: all 0.25s ease;
    }
    .chat-toggle-pill:hover {
      background: rgba(255, 255, 255, 0.12);
      border-color: rgba(255, 255, 255, 0.25);
    }
    .chat-drawer {
      position: fixed;
      top: 20px;
      right: 20px;
      bottom: 90px;
      width: 400px;
      max-width: calc(100vw - 40px);
      background: rgba(15, 23, 42, 0.82);
      backdrop-filter: blur(36px) saturate(190%);
      -webkit-backdrop-filter: blur(36px) saturate(190%);
      border: 1px solid rgba(255, 255, 255, 0.12);
      border-radius: 24px;
      box-shadow: 0 24px 60px rgba(0, 0, 0, 0.7), inset 0 1px 1px rgba(255, 255, 255, 0.15);
      z-index: 50;
      display: flex;
      flex-direction: column;
      pointer-events: auto;
      user-select: text;
      transition: transform 0.35s cubic-bezier(0.16, 1, 0.3, 1), opacity 0.3s ease;
      overflow: hidden;
    }
    .chat-drawer.collapsed {
      transform: translateX(calc(100% + 30px));
      opacity: 0;
      pointer-events: none;
    }
    .chat-drawer-header {
      padding: 16px 18px;
      background: rgba(255, 255, 255, 0.03);
      border-bottom: 1px solid rgba(255, 255, 255, 0.08);
      display: flex;
      align-items: center;
      justify-content: space-between;
    }
    .chat-drawer-title {
      font-size: 12px;
      font-weight: 700;
      letter-spacing: 0.1em;
      color: var(--text-primary);
      display: flex;
      align-items: center;
      gap: 8px;
    }
    .chat-status-pulse {
      width: 6px;
      height: 6px;
      border-radius: 50%;
      background: var(--accent-cyan);
      box-shadow: 0 0 8px var(--accent-cyan);
      animation: pulse-dot 2s infinite;
    }
    @keyframes pulse-dot {
      0%, 100% { opacity: 0.4; }
      50% { opacity: 1; }
    }
    .chat-badge-48h {
      font-size: 9px;
      padding: 2px 8px;
      background: rgba(16, 185, 129, 0.12);
      color: var(--accent-emerald);
      border: 1px solid rgba(16, 185, 129, 0.25);
      border-radius: 9999px;
      font-weight: 600;
    }
    .chat-drawer-actions {
      display: flex;
      align-items: center;
      gap: 8px;
    }
    .chat-action-btn {
      background: rgba(255, 255, 255, 0.06);
      border: 1px solid rgba(255, 255, 255, 0.1);
      color: var(--text-secondary);
      border-radius: 10px;
      padding: 4px 10px;
      font-size: 10px;
      cursor: pointer;
      transition: all 0.2s;
    }
    .chat-action-btn:hover {
      background: rgba(255, 255, 255, 0.15);
      color: #ffffff;
      border-color: rgba(255, 255, 255, 0.25);
    }
    .chat-messages-body {
      flex: 1;
      padding: 16px;
      overflow-y: auto;
      display: flex;
      flex-direction: column;
      gap: 14px;
      scrollbar-width: thin;
      scrollbar-color: rgba(255, 255, 255, 0.2) transparent;
    }
    .chat-messages-body::-webkit-scrollbar {
      width: 4px;
    }
    .chat-messages-body::-webkit-scrollbar-thumb {
      background: rgba(255, 255, 255, 0.2);
      border-radius: 4px;
    }
    .chat-msg {
      display: flex;
      flex-direction: column;
      gap: 4px;
      max-width: 90%;
      word-break: break-word;
    }
    .chat-msg.user {
      align-self: flex-end;
    }
    .chat-msg.ultron {
      align-self: flex-start;
    }
    .chat-msg-header {
      display: flex;
      align-items: center;
      gap: 6px;
      font-size: 10px;
      color: var(--text-muted);
      letter-spacing: 0.05em;
    }
    .chat-msg.user .chat-msg-header {
      justify-content: flex-end;
      color: var(--accent-cyan);
    }
    .chat-msg.ultron .chat-msg-header {
      color: var(--accent-emerald);
    }
    .chat-bubble {
      padding: 12px 16px;
      font-size: 12.5px;
      line-height: 1.55;
      letter-spacing: 0.01em;
      position: relative;
    }
    .chat-msg.user .chat-bubble {
      background: rgba(56, 189, 248, 0.16);
      border: 1px solid rgba(56, 189, 248, 0.3);
      color: #f8fafc;
      border-radius: 16px 16px 4px 16px;
    }
    .chat-msg.ultron .chat-bubble {
      background: rgba(255, 255, 255, 0.05);
      border: 1px solid rgba(255, 255, 255, 0.1);
      color: #f8fafc;
      border-radius: 16px 16px 16px 4px;
      box-shadow: 0 4px 16px rgba(0, 0, 0, 0.3);
    }
    /* Real Action Telemetry HUD in Chat */
    .chat-action-panel {
      margin-top: 10px;
      padding: 10px 12px;
      background: rgba(15, 23, 42, 0.85);
      border: 1px solid rgba(56, 189, 248, 0.35);
      border-radius: 12px;
      box-shadow: 0 4px 18px rgba(0, 0, 0, 0.45), inset 0 1px 1px rgba(56, 189, 248, 0.15);
      display: flex;
      flex-direction: column;
      gap: 8px;
    }
    .chat-action-header {
      display: flex;
      align-items: center;
      justify-content: space-between;
      border-bottom: 1px solid rgba(255, 255, 255, 0.08);
      padding-bottom: 6px;
      font-size: 10px;
      letter-spacing: 0.08em;
      font-weight: 700;
      color: var(--accent-cyan);
    }
    .action-tag {
      font-size: 8.5px;
      padding: 2px 6px;
      background: rgba(16, 185, 129, 0.2);
      color: var(--accent-emerald);
      border: 1px solid rgba(16, 185, 129, 0.4);
      border-radius: 9999px;
