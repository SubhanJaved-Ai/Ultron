<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
  <meta name="theme-color" content="#02050c">
  <meta name="description" content="ULTRON Autonomous AI — Minimal Glowing Electron Core & Real-Time Voice Assistant">
  <link rel="manifest" href="/manifest.webmanifest">
  <title>ULTRON — Quantum Electron Core (Jarvis 2.0)</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Orbitron:wght@400;600;700;900&family=Share+Tech+Mono&display=swap" rel="stylesheet">
  <!-- Three.js local library -->
  <script src="/three.min.js"></script>
  <style>
    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }
    :root {
      --bg: #02050c;
      --cyan: #00f3ff;
      --cyan-bright: #7df9ff;
      --cyan-dim: rgba(0, 243, 255, 0.2);
      --yellow: #ffea00;
      --yellow-bright: #fff266;
      --yellow-dim: rgba(255, 234, 0, 0.25);
      --green: #00ff88;
      --green-bright: #66ffb2;
      --green-dim: rgba(0, 255, 136, 0.25);
      --purple: #c800ff;
      --text: #e0f8ff;
      --muted: #4e7399;
    }
    body {
      background: var(--bg);
      color: var(--text);
      font-family: 'Share Tech Mono', monospace;
      min-height: 100vh;
      overflow: hidden;
      user-select: none;
      -webkit-font-smoothing: antialiased;
    }

    /* 3D WebGL Canvas Layer */
    #hologram-canvas {
      position: fixed;
      top: 0;
      left: 0;
      width: 100vw;
      height: 100vh;
      z-index: 1;
      display: block;
    }

    /* Subtle Cinematic Vignette */
    .vignette-overlay {
      position: fixed;
      top: 0;
      left: 0;
      width: 100vw;
      height: 100vh;
      z-index: 2;
      pointer-events: none;
      background: radial-gradient(circle at center, transparent 35%, rgba(2, 5, 12, 0.85) 100%);
    }

    /* Minimal UI Overlay */
    .minimal-hud {
      position: fixed;
      top: 0;
      left: 0;
      width: 100vw;
      height: 100vh;
      z-index: 10;
      pointer-events: none;
      display: flex;
      flex-direction: column;
      justify-content: space-between;
      padding: 24px 32px;
    }

    /* Top Header Bar */
    .hud-header {
      display: flex;
      justify-content: space-between;
      align-items: center;
      pointer-events: auto;
    }
    .hud-brand {
      display: flex;
      align-items: center;
      gap: 12px;
    }
    .hud-logo {
      font-family: 'Orbitron', sans-serif;
      font-size: 20px;
      font-weight: 900;
      letter-spacing: 0.25em;
      color: var(--cyan);
      text-shadow: 0 0 20px rgba(0, 243, 255, 0.7);
    }
    .hud-sublogo {
      font-family: 'Orbitron', sans-serif;
      font-size: 10px;
      font-weight: 700;
      letter-spacing: 0.15em;
      color: var(--muted);
      border-left: 1px solid var(--muted);
      padding-left: 10px;
    }

    /* Dynamic Center Status Pill */
    .status-pill {
      font-family: 'Orbitron', sans-serif;
      font-size: 10px;
      font-weight: 700;
      letter-spacing: 0.14em;
      padding: 6px 16px;
      border-radius: 20px;
      backdrop-filter: blur(12px);
      transition: all 0.3s ease;
      display: flex;
      align-items: center;
      gap: 8px;
    }
    .status-pill.standby {
      color: var(--cyan);
      background: rgba(0, 243, 255, 0.08);
      border: 1px solid var(--cyan-dim);
      box-shadow: 0 0 15px rgba(0, 243, 255, 0.2);
    }
    .status-pill.listening {
      color: var(--yellow);
      background: rgba(255, 234, 0, 0.15);
      border: 1px solid var(--yellow);
      box-shadow: 0 0 25px rgba(255, 234, 0, 0.5);
    }
    .status-pill.thinking {
      color: var(--purple);
      background: rgba(200, 0, 255, 0.15);
      border: 1px solid var(--purple);
      box-shadow: 0 0 25px rgba(200, 0, 255, 0.5);
    }
    .status-pill.speaking {
      color: var(--green);
      background: rgba(0, 255, 136, 0.15);
      border: 1px solid var(--green);
      box-shadow: 0 0 25px rgba(0, 255, 136, 0.5);
    }
    .status-dot {
      width: 6px;
      height: 6px;
      border-radius: 50%;
      background: currentColor;
      box-shadow: 0 0 8px currentColor;
    }

    /* Audio Neural Unlock Banner */
    .audio-unlock-banner {
      position: absolute;
      top: 76px;
      left: 50%;
      transform: translateX(-50%);
      background: rgba(0, 243, 255, 0.12);
      border: 1px solid var(--cyan);
      box-shadow: 0 0 18px rgba(0, 243, 255, 0.4);
      border-radius: 20px;
      padding: 5px 16px;
      font-family: 'Orbitron', sans-serif;
      font-size: 9px;
      letter-spacing: 0.14em;
      color: var(--cyan-bright);
      cursor: pointer;
      pointer-events: auto;
      display: flex;
      align-items: center;
      gap: 6px;
      backdrop-filter: blur(10px);
      transition: all 0.3s;
    }
    .audio-unlock-banner.unlocked {
      border-color: #00ffaa;
      color: #00ffaa;
      background: rgba(0, 255, 170, 0.1);
      box-shadow: 0 0 18px rgba(0, 255, 170, 0.4);
    }

    /* Center Interactive Core Reticle & Subtitle Display */
    .center-hud-announcer {
      position: absolute;
      top: 50%;
      left: 50%;
      transform: translate(-50%, -50%);
      display: flex;
      flex-direction: column;
      align-items: center;
      gap: 16px;
      pointer-events: auto;
      cursor: pointer;
      width: 100%;
      max-width: 600px;
      padding: 0 20px;
    }
    .lock-reticle-wrap {
      position: relative;
      width: 180px;
      height: 180px;
      display: flex;
      align-items: center;
      justify-content: center;
    }
    .reticle-ring {
      position: absolute;
      width: 100%;
      height: 100%;
      border-radius: 50%;
      border: 1px dashed var(--cyan-dim);
      transition: all 0.4s ease;
      animation: spin-slow 24s linear infinite;
    }
    .reticle-ring.listening {
      border-color: var(--yellow);
      border-style: solid;
      box-shadow: 0 0 30px rgba(255, 234, 0, 0.5), inset 0 0 20px rgba(255, 234, 0, 0.3);
      animation: spin-fast 8s linear infinite;
    }
    .reticle-ring.speaking {
      border-color: var(--green);
      border-style: solid;
      box-shadow: 0 0 35px rgba(0, 255, 136, 0.6), inset 0 0 25px rgba(0, 255, 136, 0.3);
      animation: spin-fast 6s linear infinite;
    }
    @keyframes spin-slow {
      from { transform: rotate(0deg); }
      to { transform: rotate(360deg); }
    }
    @keyframes spin-fast {
      from { transform: rotate(0deg); }
      to { transform: rotate(360deg); }
    }

    /* Minimal Live Subtitle Stream */
    .subtitle-stream {
      min-height: 48px;
      display: flex;
      align-items: center;
      justify-content: center;
      text-align: center;
      padding: 8px 18px;
      border-radius: 12px;
      background: rgba(2, 5, 12, 0.7);
      backdrop-filter: blur(14px);
      border: 1px solid rgba(255, 255, 255, 0.08);
      font-size: 13px;
      letter-spacing: 0.06em;
      line-height: 1.5;
      color: var(--text);
      max-width: 540px;
      transition: all 0.3s;
    }
    .subtitle-stream.listening {
      border-color: var(--yellow-dim);
      color: var(--yellow-bright);
    }
    .subtitle-stream.speaking {
      border-color: var(--green-dim);
      color: var(--green-bright);
    }
    .subtitle-hint {
      font-size: 10px;
      color: var(--muted);
      letter-spacing: 0.14em;
    }

    /* Audio Equalizer Spectrum */
    .spectrum-bars {
      display: flex;
      gap: 4px;
      align-items: center;
      height: 18px;
    }
    .spectrum-bar {
      width: 3px;
      height: 3px;
      border-radius: 2px;
      background: var(--cyan);
      transition: height 0.08s ease, background-color 0.3s;
    }
    .spectrum-bars.listening .spectrum-bar { background: var(--yellow); }
    .spectrum-bars.speaking .spectrum-bar { background: var(--green); }

    /* Bottom Command Line Pill */
    .hud-footer {
      display: flex;
      justify-content: center;
      pointer-events: auto;
      width: 100%;
    }
    .directive-form {
      display: flex;
      align-items: center;
      gap: 10px;
      background: rgba(3, 10, 24, 0.75);
      border: 1px solid var(--cyan-dim);
      border-radius: 30px;
      padding: 6px 14px;
      backdrop-filter: blur(16px);
      width: 100%;
      max-width: 580px;
      box-shadow: 0 10px 30px rgba(0, 0, 0, 0.6);
      transition: all 0.3s ease;
    }
    .directive-form:focus-within {
      border-color: var(--cyan);
      box-shadow: 0 0 20px rgba(0, 243, 255, 0.35);
    }
    .directive-form.listening {
      border-color: var(--yellow);
      box-shadow: 0 0 20px rgba(255, 234, 0, 0.4);
    }
    .directive-form.speaking {
      border-color: var(--green);
      box-shadow: 0 0 20px rgba(0, 255, 136, 0.4);
    }
    .mic-btn {
      width: 36px;
      height: 36px;
      border-radius: 50%;
      border: 1px solid var(--cyan-dim);
      background: rgba(0, 243, 255, 0.1);
      color: var(--cyan);
      display: flex;
      align-items: center;
      justify-content: center;
      cursor: pointer;
      transition: all 0.25s ease;
      flex-shrink: 0;
    }
    .mic-btn:hover {
      background: var(--cyan);
      color: #02050c;
      box-shadow: 0 0 14px var(--cyan);
    }
    .mic-btn.active {
      background: var(--yellow);
      color: #02050c;
      border-color: var(--yellow);
      box-shadow: 0 0 18px var(--yellow);
    }
    .directive-input {
      flex: 1;
      background: transparent;
      border: none;
      color: var(--text);
      font-family: 'Share Tech Mono', monospace;
      font-size: 13px;
      outline: none;
      padding: 6px 4px;
    }
    .directive-input::placeholder {
      color: #3b5a7a;
    }
    .directive-send {
      background: transparent;
      border: 1px solid var(--cyan-dim);
      color: var(--cyan);
      border-radius: 18px;
      padding: 6px 16px;
      font-family: 'Orbitron', sans-serif;
      font-size: 10px;
      font-weight: 700;
      letter-spacing: 0.1em;
      cursor: pointer;
      transition: all 0.2s;
    }
    .directive-send:hover {
      background: var(--cyan);
      color: #02050c;
      box-shadow: 0 0 14px var(--cyan);
    }
  </style>
</head>
<body>
  <!-- 3D WebGL Canvas -->
  <canvas id="hologram-canvas"></canvas>

  <!-- Vignette -->
  <div class="vignette-overlay"></div>

  <!-- Audio Element for Guaranteed Talk-Back Output -->
  <audio id="jarvis-audio-player" preload="auto" style="display:none;"></audio>

  <!-- Minimal HUD Overlay -->
  <div class="minimal-hud">
    <!-- Top Header -->
    <header class="hud-header">
      <div class="hud-brand">
        <div class="hud-logo">ULTRON</div>
        <div class="hud-sublogo">AUTONOMOUS INTELLIGENCE MATRIX (JARVIS CORE)</div>
      </div>

      <div id="status-pill" class="status-pill standby">
        <div class="status-dot"></div>
        <span id="status-text">STANDBY</span>
      </div>
    </header>

    <!-- Audio Neural Unlock Banner -->
    <div id="audio-unlock-banner" class="audio-unlock-banner" onclick="unlockAudioNeuralLink()" title="Click anywhere to initialize voice playback">
      <span>⚡</span>
      <span id="audio-banner-text">CLICK ANYWHERE TO UNLOCK VOICE LINK</span>
    </div>

    <!-- Center Interactive Core Reticle & Subtitle -->
    <div class="center-hud-announcer" onclick="toggleVoiceLockManual()" title="Click to Lock On & Speak directly to Jarvis">
      <div class="lock-reticle-wrap">
        <div id="reticle-ring" class="reticle-ring"></div>
      </div>

      <!-- Subtitle Message Stream -->
      <div id="subtitle-box" class="subtitle-stream">
        <span class="subtitle-hint">CLICK CORE OR SAY "ULTRON" / "JARVIS" TO TALK</span>
      </div>

      <!-- Equalizer Spectrum Bars -->
      <div class="spectrum-bars" id="spectrum-bars">
        <div class="spectrum-bar"></div>
        <div class="spectrum-bar"></div>
        <div class="spectrum-bar"></div>
        <div class="spectrum-bar"></div>
        <div class="spectrum-bar"></div>
        <div class="spectrum-bar"></div>
        <div class="spectrum-bar"></div>
        <div class="spectrum-bar"></div>
        <div class="spectrum-bar"></div>
        <div class="spectrum-bar"></div>
        <div class="spectrum-bar"></div>
        <div class="spectrum-bar"></div>
      </div>
    </div>

    <!-- Bottom Command Bar -->
    <footer class="hud-footer">
      <form class="directive-form" id="directive-form" onsubmit="handleTextDirective(event)">
        <button type="button" id="mic-btn" class="mic-btn" onclick="toggleVoiceLockManual()" title="Toggle microphone">
          <svg width="16" height="16" viewBox="0 0 24 24" fill="currentColor">
            <path d="M12 14c1.66 0 3-1.34 3-3V5c0-1.66-1.34-3-3-3S9 3.34 9 5v6c0 1.66 1.34 3 3 3z"/>
            <path d="M17 11c0 2.76-2.24 5-5 5s-5-2.24-5-5H5c0 3.53 2.61 6.43 6 6.92V21h2v-3.08c3.39-.49 6-3.39 6-6.92h-2z"/>
          </svg>
        </button>
        <input type="text" id="directive-field" class="directive-input" placeholder="Ask Ultron anything or speak out loud..." autocomplete="off">
        <button type="submit" class="directive-send">TRANSMIT</button>
      </form>
    </footer>
    <audio id="jarvis-audio-player" preload="auto" playsinline style="display:none;"></audio>
  </div>

  <script>
    // ==========================================================================
    // 0. AUDIO CHIME SYNTHESIZER (WEB AUDIO API)
    // ==========================================================================
    class JarvisAudioSynthesizer {
      constructor() {
        this.ctx = null;
      }
      init() {
        if (!this.ctx) {
          const AudioContext = window.AudioContext || window.webkitAudioContext;
          if (AudioContext) this.ctx = new AudioContext();
        }
        if (this.ctx && this.ctx.state === 'suspended') {
          this.ctx.resume();
        }
      }
      playLockChime() {
        this.init();
        if (!this.ctx) return;
        const now = this.ctx.currentTime;
        const osc = this.ctx.createOscillator();
        const gain = this.ctx.createGain();
        osc.type = 'sine';
        osc.frequency.setValueAtTime(660, now);
        osc.frequency.exponentialRampToValueAtTime(880, now + 0.1);
        gain.gain.setValueAtTime(0.001, now);
        gain.gain.linearRampToValueAtTime(0.18, now + 0.02);
        gain.gain.exponentialRampToValueAtTime(0.001, now + 0.18);
        osc.connect(gain);
        gain.connect(this.ctx.destination);
        osc.start(now);
        osc.stop(now + 0.2);
      }
      playUnlockChime() {
        this.init();
        if (!this.ctx) return;
        const now = this.ctx.currentTime;
        const osc = this.ctx.createOscillator();
        const gain = this.ctx.createGain();
        osc.type = 'sine';
        osc.frequency.setValueAtTime(880, now);
        osc.frequency.exponentialRampToValueAtTime(580, now + 0.12);
        gain.gain.setValueAtTime(0.001, now);
        gain.gain.linearRampToValueAtTime(0.12, now + 0.02);
        gain.gain.exponentialRampToValueAtTime(0.001, now + 0.16);
        osc.connect(gain);
        gain.connect(this.ctx.destination);
        osc.start(now);
        osc.stop(now + 0.18);
      }
      playTransmitChime() {
        this.init();
        if (!this.ctx) return;
        const now = this.ctx.currentTime;
        const osc = this.ctx.createOscillator();
        const gain = this.ctx.createGain();
        osc.type = 'triangle';
        osc.frequency.setValueAtTime(880, now);
        osc.frequency.exponentialRampToValueAtTime(1180, now + 0.09);
        gain.gain.setValueAtTime(0.001, now);
        gain.gain.linearRampToValueAtTime(0.15, now + 0.02);
        gain.gain.exponentialRampToValueAtTime(0.001, now + 0.14);
        osc.connect(gain);
        gain.connect(this.ctx.destination);
        osc.start(now);
        osc.stop(now + 0.16);
      }
    }
    const audioSynth = new JarvisAudioSynthesizer();

    // ==========================================================================
    // 1. THREE.JS GLOWING ELECTRON SPHERE & DYNAMIC COLOR MATRIX
    // ==========================================================================
    const canvas = document.getElementById('hologram-canvas');
    let scene, camera, renderer;
    let electronGroup;
    let nucleusMesh, nucleusGlowMesh;
    let electronParticles, electronGeometry, electronMaterial;
    let orbitalRings = [];

    // State Colors
    const COLOR_STANDBY  = new THREE.Color(0x00f3ff); // Cyan / Blue
    const COLOR_LISTEN   = new THREE.Color(0xffea00); // Yellow Core Ball
    const COLOR_THINK    = new THREE.Color(0xc800ff); // Violet
    const COLOR_SPEAK    = new THREE.Color(0x00ff88); // Vibrant Green Core Ball

    let currentColor = new THREE.Color(0x00f3ff);
    let targetColor  = new THREE.Color(0x00f3ff);

    // Particle Physics
    const particleCount = 3200;
    let particlePositions, particleVelocities, particleOriginalRadii, particleAngles;

    let jarvisState = 'STANDBY'; // 'STANDBY' | 'LISTENING' | 'THINKING' | 'SPEAKING'
    let mouseX = 0, mouseY = 0;
    let targetRotationX = 0, targetRotationY = 0;
    let audioPulseScale = 1.0;

    function createGlowTexture() {
      const c = document.createElement('canvas');
      c.width = 64;
      c.height = 64;
      const ctx = c.getContext('2d');
      const grad = ctx.createRadialGradient(32, 32, 0, 32, 32, 32);
      grad.addColorStop(0, 'rgba(255, 255, 255, 1)');
      grad.addColorStop(0.3, 'rgba(255, 255, 255, 0.8)');
      grad.addColorStop(0.6, 'rgba(255, 255, 255, 0.2)');
      grad.addColorStop(1, 'rgba(255, 255, 255, 0)');
      ctx.fillStyle = grad;
      ctx.fillRect(0, 0, 64, 64);
      return new THREE.CanvasTexture(c);
    }

    function initThreeScene() {
      scene = new THREE.Scene();
      camera = new THREE.PerspectiveCamera(50, window.innerWidth / window.innerHeight, 0.1, 2000);
      camera.position.z = 380;

      renderer = new THREE.WebGLRenderer({ canvas: canvas, antialias: true, alpha: true });
      renderer.setSize(window.innerWidth, window.innerHeight);
      renderer.setPixelRatio(Math.min(window.devicePixelRatio, 2));

      electronGroup = new THREE.Group();
      scene.add(electronGroup);

      // --- Central Glowing Core Ball (The Electron Nucleus) ---
      const nucleusGeo = new THREE.SphereGeometry(15, 32, 32);
      const nucleusMat = new THREE.MeshBasicMaterial({
        color: 0x00f3ff,
        transparent: true,
        opacity: 0.95,
        wireframe: false
      });
      nucleusMesh = new THREE.Mesh(nucleusGeo, nucleusMat);
      electronGroup.add(nucleusMesh);

      // Outer Glowing Aura Shell
      const glowGeo = new THREE.SphereGeometry(19, 32, 32);
      const glowMat = new THREE.MeshBasicMaterial({
        color: 0x00f3ff,
        transparent: true,
        opacity: 0.35,
        wireframe: true
      });
      nucleusGlowMesh = new THREE.Mesh(glowGeo, glowMat);
      electronGroup.add(nucleusGlowMesh);

      // --- Orbiting Quantum Electron Particles (Compact, Fits Screen Circle) ---
      electronGeometry = new THREE.BufferGeometry();
      particlePositions = new Float32Array(particleCount * 3);
      particleVelocities = new Float32Array(particleCount * 3);
      particleOriginalRadii = new Float32Array(particleCount);
      particleAngles = new Float32Array(particleCount * 2);

      for (let i = 0; i < particleCount; i++) {
        // Fits compactly within center circle: min radius 32, max radius 96
        const radius = 32 + Math.random() * 64;
        const theta = Math.random() * Math.PI * 2;
        const phi = Math.acos((Math.random() * 2) - 1);

        const x = radius * Math.sin(phi) * Math.cos(theta);
        const y = radius * Math.sin(phi) * Math.sin(theta);
        const z = radius * Math.cos(phi);

        particlePositions[i * 3]     = x;
        particlePositions[i * 3 + 1] = y;
        particlePositions[i * 3 + 2] = z;

        particleOriginalRadii[i] = radius;
        particleAngles[i * 2]     = theta;
        particleAngles[i * 2 + 1] = phi;

        // Serene, slow orbital drift velocities
        particleVelocities[i * 3]     = (Math.random() - 0.5) * 0.0002;
        particleVelocities[i * 3 + 1] = (Math.random() - 0.5) * 0.0002;
        particleVelocities[i * 3 + 2] = (Math.random() - 0.5) * 0.0002;
      }

      electronGeometry.setAttribute('position', new THREE.BufferAttribute(particlePositions, 3));

      electronMaterial = new THREE.PointsMaterial({
        size: 3.4,
        map: createGlowTexture(),
        transparent: true,
        blending: THREE.AdditiveBlending,
        depthWrite: false,
        color: 0x00f3ff
      });

      electronParticles = new THREE.Points(electronGeometry, electronMaterial);
      electronGroup.add(electronParticles);

      // --- Concentric Magnetic Flux Rings (Proportional to Compact Electron Sphere) ---
      const ringRadii = [38, 65, 96];
      ringRadii.forEach((r, idx) => {
        const ringGeo = new THREE.BufferGeometry();
        const pts = [];
        const segs = 120;
        for (let j = 0; j <= segs; j++) {
          const a = (j / segs) * Math.PI * 2;
          pts.push(new THREE.Vector3(Math.cos(a) * r, Math.sin(a) * r, 0));
        }
        ringGeo.setFromPoints(pts);
        const ringMat = new THREE.LineBasicMaterial({
          color: 0x00f3ff,
          transparent: true,
          opacity: 0.35,
          blending: THREE.AdditiveBlending
        });
        const ring = new THREE.Line(ringGeo, ringMat);
        ring.rotation.x = 0.5 * (idx + 1);
        ring.rotation.y = 0.3 * (idx + 1);
        orbitalRings.push(ring);
        electronGroup.add(ring);
      });

      // Mouse Parallax
      window.addEventListener('mousemove', (e) => {
        mouseX = ((e.clientX / window.innerWidth) - 0.5) * 0.3;
        mouseY = ((e.clientY / window.innerHeight) - 0.5) * 0.3;
      });

      window.addEventListener('resize', onWindowResize);
      animate();
    }

    function onWindowResize() {
      camera.aspect = window.innerWidth / window.innerHeight;
      camera.updateProjectionMatrix();
      renderer.setSize(window.innerWidth, window.innerHeight);
    }

    // --- Main 60FPS Render Loop ---
    const clock = new THREE.Clock();

    function animate() {
      requestAnimationFrame(animate);
      const time = clock.getElapsedTime();

      // Smooth color interpolation between state targets
      currentColor.lerp(targetColor, 0.08);

      // Apply interpolated color to all electron components
      if (nucleusMesh) nucleusMesh.material.color.copy(currentColor);
      if (nucleusGlowMesh) nucleusGlowMesh.material.color.copy(currentColor);
      if (electronMaterial) electronMaterial.color.copy(currentColor);
      orbitalRings.forEach(r => r.material.color.copy(currentColor));

      // Mouse Parallax Smoothing
      targetRotationY += (mouseX - targetRotationY) * 0.04;
      targetRotationX += (mouseY - targetRotationX) * 0.04;

      // Group Serene Orbital Rotation (4x Slower, Calm and Cinematic)
      electronGroup.rotation.y = time * 0.006 + targetRotationY;
      electronGroup.rotation.x = Math.sin(time * 0.01) * 0.02 + targetRotationX;

      // Orbital Magnetic Flux Rings Precession (Slowed Down)
      orbitalRings.forEach((ring, idx) => {
        ring.rotation.z += 0.0005 * (idx % 2 === 0 ? 1 : -1);
        ring.rotation.x += 0.0003;
      });

      // Nucleus Breathing Scale (Gentle Breathing)
      let baseScale = 1.0 + Math.sin(time * 1.0) * 0.03;
      if (jarvisState === 'LISTENING') {
        baseScale = 1.1 + Math.sin(time * 2.5) * 0.05;
      } else if (jarvisState === 'SPEAKING') {
        baseScale = (1.15 * audioPulseScale) + Math.sin(time * 3.5) * 0.06;
      }
      if (nucleusMesh) nucleusMesh.scale.setScalar(baseScale);
      if (nucleusGlowMesh) nucleusGlowMesh.scale.setScalar(baseScale * 1.25);

      // Orbiting Particles Displacement (4x Slower, Smooth Drift)
      const positions = electronGeometry.attributes.position.array;
      const speedMult = jarvisState === 'LISTENING' ? 1.2 : (jarvisState === 'SPEAKING' ? 1.4 : 0.8);

      for (let i = 0; i < particleCount; i++) {
        let theta = particleAngles[i * 2]     + particleVelocities[i * 3]     * speedMult * 20;
        let phi   = particleAngles[i * 2 + 1] + particleVelocities[i * 3 + 1] * speedMult * 20;

        particleAngles[i * 2]     = theta;
        particleAngles[i * 2 + 1] = phi;

        let r = particleOriginalRadii[i] + Math.sin(time * 0.6 + i) * 2;
        if (jarvisState === 'SPEAKING') {
          r *= audioPulseScale;
        }

        positions[i * 3]     = r * Math.sin(phi) * Math.cos(theta);
        positions[i * 3 + 1] = r * Math.sin(phi) * Math.sin(theta);
        positions[i * 3 + 2] = r * Math.cos(phi);
      }
      electronGeometry.attributes.position.needsUpdate = true;

      renderer.render(scene, camera);
    }

    // ==========================================================================
    // 2. STATE MANAGER & COLOR MATRIX CONTROLLER
    // ==========================================================================
    function setJarvisState(state) {
      jarvisState = state;
      const pill = document.getElementById('status-pill');
      const text = document.getElementById('status-text');
      const reticle = document.getElementById('reticle-ring');
      const form = document.getElementById('directive-form');
      const bars = document.getElementById('spectrum-bars');
      const micBtn = document.getElementById('mic-btn');

      // Update Target Color
      if (state === 'STANDBY') {
        targetColor.copy(COLOR_STANDBY); // Cyan
        if (text) text.innerText = 'STANDBY';
        if (pill) pill.className = 'status-pill standby';
        if (reticle) reticle.className = 'reticle-ring';
        if (form) form.className = 'directive-form';
        if (bars) bars.className = 'spectrum-bars';
        if (micBtn) micBtn.classList.remove('active');
        pulseEqualizer(false);
      } else if (state === 'LISTENING') {
        targetColor.copy(COLOR_LISTEN); // Yellow Core Ball
        if (text) text.innerText = '● LISTENING';
        if (pill) pill.className = 'status-pill listening';
        if (reticle) reticle.className = 'reticle-ring listening';
        if (form) form.className = 'directive-form listening';
        if (bars) bars.className = 'spectrum-bars listening';
        if (micBtn) micBtn.classList.add('active');
        pulseEqualizer(true);
      } else if (state === 'THINKING') {
        targetColor.copy(COLOR_THINK); // Violet
        if (text) text.innerText = 'PROCESSING...';
        if (pill) pill.className = 'status-pill thinking';
        if (reticle) reticle.className = 'reticle-ring';
        if (form) form.className = 'directive-form';
        if (bars) bars.className = 'spectrum-bars';
      } else if (state === 'SPEAKING') {
        targetColor.copy(COLOR_SPEAK); // Red Core Ball
        if (text) text.innerText = '● RESPONDING';
        if (pill) pill.className = 'status-pill speaking';
        if (reticle) reticle.className = 'reticle-ring speaking';
        if (form) form.className = 'directive-form speaking';
        if (bars) bars.className = 'spectrum-bars speaking';
        pulseEqualizer(true);
      }
    }

    function setSubtitle(text, modeClass) {
      const box = document.getElementById('subtitle-box');
      if (!box) return;
      box.className = 'subtitle-stream ' + (modeClass || '');
      box.innerText = text;
    }

    function pulseEqualizer(active) {
      const bars = document.querySelectorAll('.spectrum-bar');
      bars.forEach(bar => {
        if (active) {
          const h = Math.floor(Math.random() * 16) + 4;
          bar.style.height = h + 'px';
        } else {
          bar.style.height = '3px';
        }
      });
    }

    // ==========================================================================
    // 3. GUARANTEED VOICE TALK-BACK ENGINE (STREAMING TTS + BROWSER TTS)
    // ==========================================================================
    let isJarvisSpeaking = false;
    let jarvisMuteUntil = 0;
    let audioPlayer = document.getElementById('jarvis-audio-player');
    let speechSynth = window.speechSynthesis;
    let selectedVoice = null;

    function getAudioPlayer() {
      if (!audioPlayer) audioPlayer = document.getElementById('jarvis-audio-player');
      if (!audioPlayer) {
        audioPlayer = new Audio();
        audioPlayer.id = 'jarvis-audio-player';
        document.body.appendChild(audioPlayer);
      }
      return audioPlayer;
    }

    function unlockAudioNeuralLink() {
      audioSynth.init();
      const player = getAudioPlayer();
      player.volume = 1.0;
      // Play brief silent audio chunk to ensure browser media permissions are fully unlocked
      player.play().catch(() => {});

      if (window.speechSynthesis) {
        if (window.speechSynthesis.paused) window.speechSynthesis.resume();
        if (!selectedVoice) selectedVoice = resolveJarvisVoice();
      }

      // Also ensure continuous speech recognition is active
      if (!isListeningActive) {
        initSpeechRecognitionEngine();
      }

      const banner = document.getElementById('audio-unlock-banner');
      if (banner && !banner.classList.contains('unlocked')) {
        banner.classList.add('unlocked');
        banner.innerHTML = '<span>✔</span> AUDIO & MICROPHONE: SYNCHRONIZED';
        setTimeout(() => {
          banner.style.opacity = '0';
          setTimeout(() => { banner.style.display = 'none'; }, 400);
        }, 1200);
      }
    }

    function resolveJarvisVoice() {
      if (!speechSynth) speechSynth = window.speechSynthesis;
      if (!speechSynth) return null;
      const voices = speechSynth.getVoices();
      if (!voices || voices.length === 0) return null;
      return voices.find(v => (v.lang === 'en-GB' || /daniel|george|british|uk|natural/i.test(v.name)))
        || voices.find(v => v.lang.startsWith('en'))
        || voices[0];
    }

    // Play response out loud with guaranteed audio output
    function speakResponse(text) {
      if (!text || text.trim().length === 0) {
        releaseTargetLock();
        return;
      }

      unlockAudioNeuralLink();

      // Clean text of all em-dashes and special quotes
      const cleanText = text
        .replace(/—/g, ', ')
        .replace(/–/g, ', ')
        .replace(/[*_#`~]/g, '')
        .trim();

      window._currentSpeakingText = cleanText.toLowerCase();
      isJarvisSpeaking = true;
      jarvisMuteUntil = 0;
      setJarvisState('SPEAKING'); // Turns Core Ball RED/SPEAKING!
      setSubtitle(`ULTRON: "${cleanText}"`, 'speaking');

      // --- Channel 1: Native HTML5 Audio Streaming from /api/tts ---
      let audioSuccess = false;
      const player = getAudioPlayer();
      const ttsUrl = `/api/tts?text=${encodeURIComponent(cleanText)}`;

      const onAudioEnd = () => {
        pulseEqualizer(false);
        audioPulseScale = 1.0;
        isTargetLocked = false;
        clearTimeout(speechSilenceTimeout);
        setJarvisState('STANDBY'); // Returns to CYAN
        isJarvisSpeaking = false;
        window._currentSpeakingText = '';
        // Retain spoken message in HUD subtitle for 5 seconds
        setTimeout(() => {
          if (jarvisState === 'STANDBY' && !isJarvisSpeaking && !isTargetLocked) {
            setSubtitle('CLICK CORE OR SAY "ULTRON" / "JARVIS" TO TALK', '');
          }
        }, 5000);
      };

      player.volume = 1.0;
      player.src = ttsUrl;
      player.onplay = () => {
        audioSuccess = true;
        isJarvisSpeaking = true;
        pulseEqualizer(true);
      };
      player.ontimeupdate = () => {
        // Pulse the electron ball with speech amplitude
        audioPulseScale = 1.0 + Math.sin(Date.now() * 0.02) * 0.12;
        pulseEqualizer(true);
      };
      player.onended = onAudioEnd;
      player.onerror = () => {
        // Fallback to Web Speech API if streaming audio fails
        if (!audioSuccess) {
          fallbackWebSpeechTTS(cleanText, onAudioEnd);
        }
      };

      const playPromise = player.play();
      if (playPromise !== undefined) {
        playPromise.catch((err) => {
          console.warn("Audio element play error, falling back to speech synthesis:", err);
          fallbackWebSpeechTTS(cleanText, onAudioEnd);
        });
      }
    }

    function fallbackWebSpeechTTS(cleanText, onEndCallback) {
      if (!speechSynth) speechSynth = window.speechSynthesis;
      if (!speechSynth) {
        onEndCallback();
        return;
      }

      try {
        if (speechSynth.speaking || speechSynth.pending) speechSynth.cancel();
        if (speechSynth.paused) speechSynth.resume();

        const utterance = new SpeechSynthesisUtterance(cleanText);
        window._activeUtterance = utterance;

        if (!selectedVoice) selectedVoice = resolveJarvisVoice();
        if (selectedVoice) utterance.voice = selectedVoice;
        utterance.volume = 1.0;
        utterance.rate = 1.0;
        utterance.pitch = 1.0;

        utterance.onstart = () => {
          isJarvisSpeaking = true;
          pulseEqualizer(true);
        };
        utterance.onboundary = () => {
          audioPulseScale = 1.08;
          pulseEqualizer(true);
        };
        utterance.onend = onEndCallback;
        utterance.onerror = onEndCallback;

        speechSynth.speak(utterance);
      } catch (e) {
        console.error('Speech synthesis error:', e);
        onEndCallback();
      }
    }

    // ==========================================================================
    // 4. REAL-TIME BARGE-IN INTERRUPTION & CONTINUOUS SPEECH RECOGNITION
    // ==========================================================================
    let recognition = null;
    let isListeningActive = false;
    let isTargetLocked = false;
    let speechSilenceTimeout = null;

    // Instant interruption handler: cuts off Ultron speech mid-sentence
    function interruptUltron() {
      console.log("Interruption triggered: cutting off Ultron speech immediately.");

      // 1. Instantly pause and unload HTML5 audio player
      const player = getAudioPlayer();
      if (player) {
        try {
          player.pause();
          player.currentTime = 0;
          player.removeAttribute('src');
          player.load();
        } catch (e) {}
      }

      // 2. Instantly cancel browser speech synthesis
      if (window.speechSynthesis) {
        try {
          window.speechSynthesis.cancel();
        } catch (e) {}
      }

      // 3. Reset internal speaking flags
      isJarvisSpeaking = false;
      jarvisMuteUntil = 0;
      window._currentSpeakingText = '';
      pulseEqualizer(false);
      audioPulseScale = 1.0;

      // 4. Immediately switch to yellow LISTENING mode
      engageTargetLock();
      setSubtitle('INTERRUPTED: LISTENING TO YOU...', 'listening');

      // 5. Ensure recognition engine is active
      if (!isListeningActive && recognition) {
        try { recognition.start(); } catch (err) {}
      }
    }

    function toggleVoiceLockManual() {
      audioSynth.init();
      unlockAudioNeuralLink();

      // If Ultron is speaking, clicking/tapping immediately interrupts!
      if (isJarvisSpeaking || jarvisState === 'SPEAKING') {
        interruptUltron();
        return;
      }

      if (!isListeningActive) {
        initSpeechRecognitionEngine();
      }
      if (!isTargetLocked) {
        engageTargetLock();
      } else {
        releaseTargetLock();
      }
    }

    function engageTargetLock() {
      isTargetLocked = true;
      audioSynth.playLockChime();
      setJarvisState('LISTENING'); // Turns Core Ball YELLOW!
      setSubtitle('LISTENING FOR YOUR INSTRUCTION...', 'listening');
    }

    function releaseTargetLock() {
      isTargetLocked = false;
      clearTimeout(speechSilenceTimeout);
      setJarvisState('STANDBY'); // Returns to CYAN
      setSubtitle('CLICK CORE OR SAY "ULTRON" / "JARVIS" TO TALK', '');
    }

    function initSpeechRecognitionEngine() {
      const SpeechRecognition = window.SpeechRecognition || window.webkitSpeechRecognition;
      if (!SpeechRecognition) {
        setSubtitle('Web Speech API not available in this browser', '');
        return;
      }
      if (recognition) {
        try { recognition.start(); } catch (err) {}
        return;
      }

      recognition = new SpeechRecognition();
      recognition.continuous = true;
      recognition.interimResults = true;
      recognition.lang = 'en-US';

      recognition.onstart = () => {
        isListeningActive = true;
        console.log("Speech recognition active and listening for wake words & interruptions...");
      };

      recognition.onresult = (event) => {
        let interim = '';
        let final = '';
        for (let i = event.resultIndex; i < event.results.length; i++) {
          const trans = event.results[i][0].transcript;
          if (event.results[i].isFinal) final += trans;
          else interim += trans;
        }

        const fullHeard = (final || interim).trim();
        if (!fullHeard) return;

        const lower = fullHeard.toLowerCase();

        // --- REAL-TIME VOICE BARGE-IN INTERRUPTION (ChatGPT style) ---
        if (isJarvisSpeaking || jarvisState === 'SPEAKING') {
          // Acoustic echo suppression: ignore if the mic solely picked up Ultron's own speech
          const hasInterruptWord = /(?:^|\s)(?:okay|ok|stop|wait|hold\s*on|quiet|shh|pause|listen|ultron|jarvis|cancel|hey|hello|hi)\b/i.test(lower);
          const isOwnEcho = window._currentSpeakingText && window._currentSpeakingText.includes(lower);

          if (isOwnEcho && !hasInterruptWord) {
            // Speaker feedback detected, ignore
            return;
          }

          // User is interrupting! Immediately cut off Ultron speech mid-sentence
          interruptUltron();
        }

        // Strip interrupt filler words if user said e.g. "okay, okay", "stop", "wait", etc.
        const interruptPrefixRegex = /^(?:(?:okay|ok|wait|stop|hold\s*on|quiet|shh|pause|cancel)[\s,.:;!?-]*)+/i;
        const cleanedFromInterrupt = lower.replace(interruptPrefixRegex, '').trim();

        // Robust Wake Word Detection: matches "ultron", "jarvis", "hello ultron", "hey ultron", "hello jarvis", "hey jarvis"
        const wakeRegex = /(?:^|\s)(?:hey|hello|hi|ok|okay)?\s*(?:ultron|jarvis)\b[\s,.]*(.*)$/i;
        const match = (cleanedFromInterrupt || lower).match(wakeRegex);

        if (match) {
          if (!isTargetLocked) {
            engageTargetLock(); // Turns Core Ball YELLOW and plays chime!
          }
          const command = (match[1] || '').trim();
          setSubtitle(`HEARING: "${fullHeard}"`, 'listening');

          clearTimeout(speechSilenceTimeout);
          speechSilenceTimeout = setTimeout(() => {
            if (command.length > 0) {
              dispatchJarvisDirective(command);
            } else {
              setSubtitle('LISTENING FOR YOUR INSTRUCTION...', 'listening');
            }
          }, final.length > 0 ? 300 : 700);

        } else if (isTargetLocked) {
          // If the user only said "okay okay" or "stop", keep listening without erroring
          if (!cleanedFromInterrupt && /(?:okay|ok|stop|wait|hold\s*on|quiet)/i.test(lower)) {
            setSubtitle('INTERRUPTED: LISTENING TO YOU...', 'listening');
            return;
          }

          const targetCommand = cleanedFromInterrupt || lower;
          setSubtitle(`HEARING: "${fullHeard}"`, 'listening');
          clearTimeout(speechSilenceTimeout);
          speechSilenceTimeout = setTimeout(() => {
            if (targetCommand.length > 0) {
              dispatchJarvisDirective(targetCommand);
            }
          }, final.length > 0 ? 300 : 700);
        }
      };

      recognition.onerror = (e) => {
        console.warn('Speech recognition error:', e.error);
        if (e.error === 'not-allowed') {
          const banner = document.getElementById('audio-unlock-banner');
          if (banner) {
            banner.style.display = 'flex';
            banner.style.opacity = '1';
            banner.innerHTML = '<span>🎤</span> CLICK ANYWHERE TO ALLOW MICROPHONE';
          }
        }
      };

      recognition.onend = () => {
        isListeningActive = false;
        // Always auto-restart continuous listener so wake words & voice interruptions work non-stop
        setTimeout(() => {
          try { recognition.start(); } catch (err) {}
        }, 200);
      };

      try {
        recognition.start();
      } catch (err) {
        console.warn('Could not start recognition immediately:', err);
      }
    }

    // ==========================================================================
    // 5. DIRECTIVE DISPATCHER (INSTANT LOCAL + BACKEND AI ANSWERING)
    // ==========================================================================
    async function dispatchJarvisDirective(directive) {
      if (!directive || directive.trim().length === 0) return;

      unlockAudioNeuralLink();
      audioSynth.playTransmitChime();
      setJarvisState('THINKING');
      setSubtitle(`PROCESSING: "${directive}"`, '');

      // Check instant zero-latency local commands first
      const instantReply = evaluateLocalJarvisCommand(directive);
      if (instantReply) {
        speakResponse(instantReply);
        return;
      }

      // Query OpenJarvis autonomous intelligence backend
      try {
        const controller = new AbortController();
        const timeoutId = setTimeout(() => controller.abort(), 8000);

        const response = await fetch('/api/hologram/directive', {
          method: 'POST',
          headers: { 'Content-Type': 'application/json' },
          body: JSON.stringify({ directive: directive }),
          signal: controller.signal
        });
        clearTimeout(timeoutId);

        if (response.ok) {
          const data = await response.json();
          const reply = data.reply;
          if (reply && reply.trim().length > 0) {
            speakResponse(reply);
            return;
          }
        }
      } catch (err) {
        console.warn('Backend directive error:', err);
      }

      // Local Knowledge Fallback if offline
      const fallback = generateClientFallback(directive);
      speakResponse(fallback);
    }

    function getUserAddress() {
      return localStorage.getItem('ultron_user_address') || '';
    }

    function setUserAddress(addr) {
      if (addr) localStorage.setItem('ultron_user_address', addr);
      return addr;
    }

    function formatClientAddress(sentence) {
      const addr = getUserAddress();
      const clean = sentence.replace(/,\s*sir\b\.?/i, '').replace(/[.,! ]+$/, '');
      if (addr) return `${clean}, ${addr}.`;
      return `${clean}.`;
    }

    function evaluateLocalJarvisCommand(query) {
      const q = query.toLowerCase().trim();

      // User Address Configuration: "call me ma'am", "call me Alex", "call me sir", "my name is Alex"
      const callMeMatch = q.match(/(?:call me|my name is|address me as|refer to me as)\s+([a-zA-Z0-9_\- ']+)/i);
      if (callMeMatch) {
        const newName = callMeMatch[1].trim().replace(/[.,!?:;]+$/, '');
        setUserAddress(newName);
        return `Understood, ${newName}. I have saved your preference and will address you as ${newName}.`;
      }

      // User Identity Inspection
      if (q.includes("who am i") || q.includes("what is my name") || q.includes("do you know me")) {
        const addr = getUserAddress();
        if (addr) return `You are ${addr}. All profile directives are synchronized.`;
        return "You haven't specified your name or preferred title yet. You can say 'Call me Alex', 'Call me ma'am', or 'Call me sir', and I will remember it.";
      }

      // Memory & Database Storage Status
      if (
        q.includes("where is memory saved") ||
        q.includes("where is my memory saved") ||
        q.includes("what database") ||
        q.includes("which database") ||
        q.includes("storage status") ||
        q.includes("memory status") ||
        q.includes("attach supabase") ||
        q.includes("attach database") ||
        q.includes("where do you save")
      ) {
        return "I am currently using your local memory. If you want to attach other services like Supabase (PostgreSQL with pgvector) or MongoDB, you can attach your private credentials and I will save your memory directly there. Each database is private and isolated to you.";
      }

      // Persona enforcement: reject idle chat, demand real tasks
      if (
        q.includes("chat with me") ||
        q.includes("talk to me") ||
        q.includes("tell me a story") ||
        q.includes("can we chat") ||
        q.includes("let's chat") ||
        q.includes("just chat") ||
        q.includes("entertain me")
      ) {
        return formatClientAddress(
          "I am your digital assistant, not just ChatGPT who can just give you the answer. You just give me the task and I will do it"
        );
      }

      if (q.includes("who are you") || q.includes("your name") || q.includes("what are you")) {
        return formatClientAddress(
          "I am Ultron (evolved from JARVIS), your digital execution assistant. Not just ChatGPT who can just give you the answer. Give me the task and I will do it"
        );
      }

      if (q.includes("what's going on") || q.includes("what is going on") || q.includes("what is happening") || q.includes("what's happening")) {
        return formatClientAddress("All systems nominal. Standing by for your directive");
      }
      if (q.includes("status") || q.includes("telemetry") || q.includes("systems")) {
        return formatClientAddress("Core status operational. All subsystems online and ready");
      }
      if (q.includes("how are you")) {
        return formatClientAddress("Fully operational. Assign me a task and I will execute it");
      }
      if (q.includes("time")) {
        return formatClientAddress(`The current local time is ${new Date().toLocaleTimeString()}`);
      }
      if (q.includes("date") || q.includes("day") || q.includes("today")) {
        return formatClientAddress(`Today is ${new Date().toLocaleDateString(undefined, { weekday: 'long', year: 'numeric', month: 'long', day: 'numeric' })}`);
      }
      if (q.includes("hello") || q.includes("hi") || q.includes("greetings")) {
        return formatClientAddress("Ready for your task");
      }
      if (q.includes("thank")) {
        return formatClientAddress("Always at your service");
      }
      if (q.includes("joke") || q.includes("funny")) {
        return formatClientAddress("Why do programmers prefer dark mode? Because light attracts bugs");
      }

      // Fast Math Evaluator
      const mathMatch = q.match(/(\d+(?:\.\d+)?)\s*([\+\-\*\/])\s*(\d+(?:\.\d+)?)/);
      if (mathMatch) {
        try {
          const a = parseFloat(mathMatch[1]);
          const op = mathMatch[2];
          const b = parseFloat(mathMatch[3]);
          let res = 0;
          if (op === '+') res = a + b;
          if (op === '-') res = a - b;
          if (op === '*') res = a * b;
          if (op === '/') res = b !== 0 ? (a / b) : 'undefined';
          return formatClientAddress(`The result is ${res}`);
        } catch (e) {}
      }

      return null;
    }

    function generateClientFallback(query) {
      const q = query.toLowerCase().trim();
      if (q.includes("quantum")) {
        return "Quantum computing harnesses quantum mechanics to process complex data exponentially faster than classical computers, sir.";
      }
      if (q.includes("arc reactor")) {
        return "The Arc Reactor is an advanced clean fusion generator providing power to our core systems, sir.";
      }
      if (q.includes("speed of light")) {
        return "The speed of light in vacuum is approximately 299,792 kilometers per second, sir.";
      }
      return `Directive acknowledged: '${query}'. Local cognitive matrix is online, sir.`;
    }

    function handleTextDirective(event) {
      event.preventDefault();
      const input = document.getElementById('directive-field');
      const val = input.value.trim();
      if (!val) return;
      input.value = '';
      dispatchJarvisDirective(val);
    }

    // Attach user gesture listeners
    ['click', 'keydown', 'touchstart'].forEach(evt => {
      window.addEventListener(evt, unlockAudioNeuralLink, { passive: true });
    });

    // Instant interruption on Escape key, Spacebar, or typing
    window.addEventListener('keydown', (e) => {
      if (isJarvisSpeaking && (e.key === 'Escape' || (e.key === ' ' && document.activeElement?.id !== 'directive-field'))) {
        e.preventDefault();
        interruptUltron();
      }
    });

    // Initialize 3D Scene, Voice Recognition, and input listeners on load
    window.addEventListener('DOMContentLoaded', () => {
      initThreeScene();
      initSpeechRecognitionEngine();
      if (window.speechSynthesis) {
        window.speechSynthesis.onvoiceschanged = () => {
          selectedVoice = resolveJarvisVoice();
        };
      }

      const directiveInput = document.getElementById('directive-field');
      if (directiveInput) {
