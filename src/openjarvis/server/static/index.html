  <script>
    // ==========================================================================
    // 0. AUDIO CHIME SYNTHESIZER (WEB AUDIO API)
    // ==========================================================================
    class JarvisAudioSynthesizer {
      constructor() {
        this.ctx = null;
      }
      init() {
        if (!this.ctx) {
          const AudioContext = window.AudioContext || window.webkitAudioContext;
          if (AudioContext) this.ctx = new AudioContext();
        }
        if (this.ctx && this.ctx.state === 'suspended') {
          this.ctx.resume();
        }
      }
      playLockChime() {
        this.init();
        if (!this.ctx) return;
        const now = this.ctx.currentTime;
        const osc = this.ctx.createOscillator();
        const gain = this.ctx.createGain();
        osc.type = 'sine';
        osc.frequency.setValueAtTime(660, now);
        osc.frequency.exponentialRampToValueAtTime(880, now + 0.1);
        gain.gain.setValueAtTime(0.001, now);
        gain.gain.linearRampToValueAtTime(0.18, now + 0.02);
        gain.gain.exponentialRampToValueAtTime(0.001, now + 0.18);
        osc.connect(gain);
        gain.connect(this.ctx.destination);
        osc.start(now);
        osc.stop(now + 0.2);
      }
      playUnlockChime() {
        this.init();
        if (!this.ctx) return;
        const now = this.ctx.currentTime;
        const osc = this.ctx.createOscillator();
        const gain = this.ctx.createGain();
        osc.type = 'sine';
        osc.frequency.setValueAtTime(880, now);
        osc.frequency.exponentialRampToValueAtTime(580, now + 0.12);
        gain.gain.setValueAtTime(0.001, now);
        gain.gain.linearRampToValueAtTime(0.12, now + 0.02);
        gain.gain.exponentialRampToValueAtTime(0.001, now + 0.16);
        osc.connect(gain);
        gain.connect(this.ctx.destination);
        osc.start(now);
        osc.stop(now + 0.18);
      }
      playTransmitChime() {
        this.init();
        if (!this.ctx) return;
        const now = this.ctx.currentTime;
        const osc = this.ctx.createOscillator();
        const gain = this.ctx.createGain();
        osc.type = 'triangle';
        osc.frequency.setValueAtTime(880, now);
        osc.frequency.exponentialRampToValueAtTime(1180, now + 0.09);
        gain.gain.setValueAtTime(0.001, now);
        gain.gain.linearRampToValueAtTime(0.15, now + 0.02);
        gain.gain.exponentialRampToValueAtTime(0.001, now + 0.14);
        osc.connect(gain);
        gain.connect(this.ctx.destination);
        osc.start(now);
        osc.stop(now + 0.16);
      }
    }
    const audioSynth = new JarvisAudioSynthesizer();

    // ==========================================================================
    // 1. THREE.JS GLOWING ELECTRON SPHERE & DYNAMIC COLOR MATRIX
    // ==========================================================================
    const canvas = document.getElementById('hologram-canvas');
    let scene, camera, renderer;
    let electronGroup;
    let nucleusMesh, nucleusGlowMesh;
    let electronParticles, electronGeometry, electronMaterial;
    let orbitalRings = [];

    // State Colors
    const COLOR_STANDBY  = new THREE.Color(0x00f3ff); // Cyan / Blue
    const COLOR_LISTEN   = new THREE.Color(0xffea00); // Yellow Core Ball
    const COLOR_THINK    = new THREE.Color(0xc800ff); // Violet
    const COLOR_SPEAK    = new THREE.Color(0x00ff88); // Vibrant Green Core Ball

    let currentColor = new THREE.Color(0x00f3ff);
    let targetColor  = new THREE.Color(0x00f3ff);

    // Particle Physics
    const particleCount = 3200;
    let particlePositions, particleVelocities, particleOriginalRadii, particleAngles;

    let jarvisState = 'STANDBY'; // 'STANDBY' | 'LISTENING' | 'THINKING' | 'SPEAKING'
    let mouseX = 0, mouseY = 0;
    let targetRotationX = 0, targetRotationY = 0;
    let audioPulseScale = 1.0;

    function createGlowTexture() {
      const c = document.createElement('canvas');
      c.width = 64;
      c.height = 64;
      const ctx = c.getContext('2d');
      const grad = ctx.createRadialGradient(32, 32, 0, 32, 32, 32);
      grad.addColorStop(0, 'rgba(255, 255, 255, 1)');
      grad.addColorStop(0.3, 'rgba(255, 255, 255, 0.8)');
      grad.addColorStop(0.6, 'rgba(255, 255, 255, 0.2)');
      grad.addColorStop(1, 'rgba(255, 255, 255, 0)');
      ctx.fillStyle = grad;
      ctx.fillRect(0, 0, 64, 64);
      return new THREE.CanvasTexture(c);
    }

    function initThreeScene() {
      scene = new THREE.Scene();
      camera = new THREE.PerspectiveCamera(50, window.innerWidth / window.innerHeight, 0.1, 2000);
      camera.position.z = 460; // Clean perspective zoom: gives over 120px clearance above chat card

      renderer = new THREE.WebGLRenderer({ canvas: canvas, antialias: true, alpha: true });
      renderer.setSize(window.innerWidth, window.innerHeight);
      renderer.setPixelRatio(Math.min(window.devicePixelRatio, 2));

      electronGroup = new THREE.Group();
      electronGroup.position.y = 34; // Elevated 34 units above center: completely clears the bottom chat window
      scene.add(electronGroup);

      // --- Central Glowing Core Ball (The Electron Nucleus) ---
      const nucleusGeo = new THREE.SphereGeometry(15, 32, 32);
      const nucleusMat = new THREE.MeshBasicMaterial({
        color: 0x00f3ff,
        transparent: true,
        opacity: 0.95,
        wireframe: false
      });
      nucleusMesh = new THREE.Mesh(nucleusGeo, nucleusMat);
      electronGroup.add(nucleusMesh);

      // Outer Glowing Aura Shell
      const glowGeo = new THREE.SphereGeometry(19, 32, 32);
      const glowMat = new THREE.MeshBasicMaterial({
        color: 0x00f3ff,
        transparent: true,
        opacity: 0.35,
        wireframe: true
      });
      nucleusGlowMesh = new THREE.Mesh(glowGeo, glowMat);
      electronGroup.add(nucleusGlowMesh);

      // --- Orbiting Quantum Electron Particles (Alive, Fluid Speed) ---
      electronGeometry = new THREE.BufferGeometry();
      particlePositions = new Float32Array(particleCount * 3);
      particleVelocities = new Float32Array(particleCount * 3);
      particleOriginalRadii = new Float32Array(particleCount);
      particleAngles = new Float32Array(particleCount * 2);

      for (let i = 0; i < particleCount; i++) {
        // Fits compactly within perfect circle boundary R = 96
        const radius = 26 + Math.random() * 70;
        const theta = Math.random() * Math.PI * 2;
        const phi = 0.15 + Math.random() * (Math.PI - 0.30);

        const x = radius * Math.sin(phi) * Math.cos(theta);
        const y = radius * Math.sin(phi) * Math.sin(theta);
        const z = radius * Math.cos(phi);

        particlePositions[i * 3]     = x;
        particlePositions[i * 3 + 1] = y;
        particlePositions[i * 3 + 2] = z;

        particleOriginalRadii[i] = radius;
        particleAngles[i * 2]     = theta;
        particleAngles[i * 2 + 1] = phi;

        // Fluid, alive speed (not too high, not too low): 0.0034 to 0.0070 rad/frame
        const dir = Math.random() < 0.5 ? 1 : -1;
        const thetaSpeed = dir * (0.0034 + Math.random() * 0.0036);
        const phiSpeed   = (Math.random() - 0.5) * 0.0012;
        const radialFreq = Math.random() * Math.PI * 2;

        particleVelocities[i * 3]     = thetaSpeed;
        particleVelocities[i * 3 + 1] = phiSpeed;
        particleVelocities[i * 3 + 2] = radialFreq;
      }

      electronGeometry.setAttribute('position', new THREE.BufferAttribute(particlePositions, 3));

      electronMaterial = new THREE.PointsMaterial({
        size: 3.0,
        map: createGlowTexture(),
        transparent: true,
        blending: THREE.AdditiveBlending,
        depthWrite: false,
        color: 0x00f3ff
      });

      electronParticles = new THREE.Points(electronGeometry, electronMaterial);
      electronGroup.add(electronParticles);

      // --- Helper Functions for Thread-Thin Geometric Lines ---
      function createFrontalCircle(radius, opacity, rotSpeedZ = 0) {
        const pts = [];
        const segs = 128;
        for (let j = 0; j <= segs; j++) {
          const a = (j / segs) * Math.PI * 2;
          pts.push(new THREE.Vector3(Math.cos(a) * radius, Math.sin(a) * radius, 0));
        }
        const geo = new THREE.BufferGeometry().setFromPoints(pts);
        const mat = new THREE.LineBasicMaterial({
          color: 0x00f3ff,
          transparent: true,
          opacity: opacity || 0.45,
          blending: THREE.AdditiveBlending,
          linewidth: 1
        });
        const line = new THREE.LineLoop(geo, mat);
        line.userData = { rotSpeedZ: rotSpeedZ };
        return line;
      }

      function createThreadRing(radius, yOffset, opacity) {
        const pts = [];
        const segs = 128;
        for (let j = 0; j <= segs; j++) {
          const a = (j / segs) * Math.PI * 2;
          pts.push(new THREE.Vector3(Math.cos(a) * radius, yOffset || 0, Math.sin(a) * radius));
        }
        const geo = new THREE.BufferGeometry().setFromPoints(pts);
        const mat = new THREE.LineBasicMaterial({
          color: 0x00f3ff,
          transparent: true,
          opacity: opacity || 0.35,
          blending: THREE.AdditiveBlending,
          linewidth: 1
        });
        return new THREE.LineLoop(geo, mat);
      }

      // 1. Master Outer Boundary Circle (Defines 100% Perfect Circular Silhouette)
      const outerBoundaryThread = createFrontalCircle(96, 0.70, 0.0003);
      electronGroup.add(outerBoundaryThread);
      orbitalRings.push(outerBoundaryThread);

      const rimTorusGeo = new THREE.TorusGeometry(96, 0.12, 8, 96);
      const rimTorusMat = new THREE.MeshBasicMaterial({
        color: 0x00f3ff,
        transparent: true,
        opacity: 0.35,
        blending: THREE.AdditiveBlending
      });
      const rimTorus = new THREE.Mesh(rimTorusGeo, rimTorusMat);
      electronGroup.add(rimTorus);
      orbitalRings.push(rimTorus);

      // 2. Frontal Concentric Thread Rings (100% Mathematically Perfect Circles, Thin as Thread)
      const frontalRadii = [84, 72, 60, 48, 36, 26, 18];
      frontalRadii.forEach((r, idx) => {
        const speed = 0.0004 * (idx % 2 === 0 ? 1 : -1);
        const ring = createFrontalCircle(r, 0.40 + (idx * 0.02), speed);
        electronGroup.add(ring);
        orbitalRings.push(ring);
      });

      // 3. Spherical Meridian Thread Rings (Passing through poles, radius 96, sweeping perfect sphere)
      for (let m = 0; m < 8; m++) {
        const alpha = m * (Math.PI / 8);
        const pts = [];
        const segs = 128;
        for (let j = 0; j <= segs; j++) {
          const theta = (j / segs) * Math.PI * 2;
          const x = 96 * Math.sin(theta) * Math.cos(alpha);
          const y = 96 * Math.cos(theta);
          const z = 96 * Math.sin(theta) * Math.sin(alpha);
          pts.push(new THREE.Vector3(x, y, z));
        }
        const geo = new THREE.BufferGeometry().setFromPoints(pts);
        const mat = new THREE.LineBasicMaterial({
          color: 0x00f3ff,
          transparent: true,
          opacity: 0.32,
          blending: THREE.AdditiveBlending,
          linewidth: 1
        });
        const mRing = new THREE.LineLoop(geo, mat);
        electronGroup.add(mRing);
        orbitalRings.push(mRing);
      }

      // 4. Spherical Latitude Thread Rings (Hugging the exact R = 96 sphere from pole to pole)
      const latElevations = [18, -18, 38, -38, 58, -58, 76, -76];
      latElevations.forEach((yElev) => {
        const rLat = Math.sqrt(96 * 96 - yElev * yElev);
        const latRing = createThreadRing(rLat, yElev, 0.30);
        electronGroup.add(latRing);
        orbitalRings.push(latRing);
      });

      // Mouse Parallax
      window.addEventListener('mousemove', (e) => {
        mouseX = ((e.clientX / window.innerWidth) - 0.5) * 0.25;
        mouseY = ((e.clientY / window.innerHeight) - 0.5) * 0.25;
      });

      window.addEventListener('resize', onWindowResize);
      animate();
    }

    function onWindowResize() {
      camera.aspect = window.innerWidth / window.innerHeight;
      camera.updateProjectionMatrix();
      renderer.setSize(window.innerWidth, window.innerHeight);
    }

    // --- Main 60FPS Render Loop ---
    const clock = new THREE.Clock();

    function animate() {
      requestAnimationFrame(animate);
      const time = clock.getElapsedTime();

      // Smooth color interpolation between state targets
      currentColor.lerp(targetColor, 0.08);

      // Apply interpolated color to all electron components
      if (nucleusMesh) nucleusMesh.material.color.copy(currentColor);
      if (nucleusGlowMesh) nucleusGlowMesh.material.color.copy(currentColor);
      if (electronMaterial) electronMaterial.color.copy(currentColor);
      orbitalRings.forEach(r => {
        r.material.color.copy(currentColor);
        if (r.userData && r.userData.rotSpeedZ) {
          r.rotation.z += r.userData.rotSpeedZ;
        }
      });

      // Dynamically project the 3D center of the nucleus to 2D screen coordinates
      const centerVec = new THREE.Vector3(0, electronGroup.position.y, 0);
      centerVec.project(camera);
      const screenX = (centerVec.x * 0.5 + 0.5) * window.innerWidth;
      const screenY = (-(centerVec.y * 0.5) + 0.5) * window.innerHeight;
      const reticleStage = document.getElementById('core-reticle-stage');
      if (reticleStage) {
        reticleStage.style.left = screenX + 'px';
        reticleStage.style.top = screenY + 'px';
      }

      // Mouse Parallax Smoothing
      targetRotationY += (mouseX - targetRotationY) * 0.04;
      targetRotationX += (mouseY - targetRotationX) * 0.04;

      // Group Serene Orbital Rotation (Rotates around Y, maintaining a 100% perfect circular silhouette)
      electronGroup.rotation.y = time * 0.008 + targetRotationY;
      electronGroup.rotation.x = targetRotationX * 0.15; // Kept near-zero so outer perimeter remains a perfect circle

      // Nucleus Breathing Scale (Gentle Breathing)
      let baseScale = 1.0 + Math.sin(time * 1.0) * 0.03;
      if (jarvisState === 'LISTENING') {
        baseScale = 1.1 + Math.sin(time * 2.5) * 0.05;
      } else if (jarvisState === 'SPEAKING') {
        baseScale = (1.15 * audioPulseScale) + Math.sin(time * 3.5) * 0.06;
      }
      if (nucleusMesh) nucleusMesh.scale.setScalar(baseScale);
      if (nucleusGlowMesh) nucleusGlowMesh.scale.setScalar(baseScale * 1.25);

      // Orbiting Quantum Electron Particles Displacement (Alive, Fluid Speed)
      const positions = electronGeometry.attributes.position.array;
      const speedMult = jarvisState === 'LISTENING' ? 1.25 : (jarvisState === 'SPEAKING' ? 1.5 : 1.0);

      for (let i = 0; i < particleCount; i++) {
        // Continuous fluid orbital progression
        particleAngles[i * 2]     += particleVelocities[i * 3]     * speedMult;
        particleAngles[i * 2 + 1] += particleVelocities[i * 3 + 1] * speedMult;

        let theta = particleAngles[i * 2];
        let phi   = particleAngles[i * 2 + 1];

        // Soft rebound near poles to maintain smooth spherical motion
        if (phi < 0.14) {
          particleAngles[i * 2 + 1] = 0.14;
          particleVelocities[i * 3 + 1] = Math.abs(particleVelocities[i * 3 + 1]);
        } else if (phi > Math.PI - 0.14) {
          particleAngles[i * 2 + 1] = Math.PI - 0.14;
          particleVelocities[i * 3 + 1] = -Math.abs(particleVelocities[i * 3 + 1]);
        }

        let r = particleOriginalRadii[i] + Math.sin(time * 1.5 + particleVelocities[i * 3 + 2]) * 2.5;
        if (jarvisState === 'SPEAKING') {
          r *= audioPulseScale;
        }

        positions[i * 3]     = r * Math.sin(phi) * Math.cos(theta);
        positions[i * 3 + 1] = r * Math.sin(phi) * Math.sin(theta);
        positions[i * 3 + 2] = r * Math.cos(phi);
      }
      electronGeometry.attributes.position.needsUpdate = true;

      renderer.render(scene, camera);
    }

    // ==========================================================================
    // 2. STATE MANAGER & COLOR MATRIX CONTROLLER
    // ==========================================================================
    function setJarvisState(state) {
      jarvisState = state;
      const pill = document.getElementById('status-pill');
      const text = document.getElementById('status-text');
      const reticle = document.getElementById('reticle-ring');
      const form = document.getElementById('directive-form');
      const bars = document.getElementById('spectrum-bars');
      const micBtn = document.getElementById('mic-btn');

      // Update Target Color
      if (state === 'STANDBY') {
        targetColor.copy(COLOR_STANDBY); // Cyan
        if (text) text.innerText = 'STANDBY';
        if (pill) pill.className = 'status-pill standby';
        if (reticle) reticle.className = 'reticle-ring';
        if (form) form.className = 'directive-form';
        if (bars) bars.className = 'spectrum-bars';
        if (micBtn) micBtn.classList.remove('active');
        pulseEqualizer(false);
      } else if (state === 'LISTENING') {
        targetColor.copy(COLOR_LISTEN); // Yellow Core Ball
        if (text) text.innerText = '● LISTENING';
        if (pill) pill.className = 'status-pill listening';
        if (reticle) reticle.className = 'reticle-ring listening';
        if (form) form.className = 'directive-form listening';
        if (bars) bars.className = 'spectrum-bars listening';
        if (micBtn) micBtn.classList.add('active');
        pulseEqualizer(true);
      } else if (state === 'THINKING') {
        targetColor.copy(COLOR_THINK); // Violet
        if (text) text.innerText = 'PROCESSING...';
        if (pill) pill.className = 'status-pill thinking';
        if (reticle) reticle.className = 'reticle-ring';
        if (form) form.className = 'directive-form';
        if (bars) bars.className = 'spectrum-bars';
      } else if (state === 'SPEAKING') {
        targetColor.copy(COLOR_SPEAK); // Red Core Ball
        if (text) text.innerText = '● RESPONDING';
        if (pill) pill.className = 'status-pill speaking';
        if (reticle) reticle.className = 'reticle-ring speaking';
        if (form) form.className = 'directive-form speaking';
        if (bars) bars.className = 'spectrum-bars speaking';
        pulseEqualizer(true);
      }
    }

    let lastSpokenResponseText = '';

    function setSubtitle(text, modeClass) {
      const box = document.getElementById('subtitle-box');
      const card = document.getElementById('response-glass-card');
      const speaker = document.getElementById('response-speaker-name');
      if (!box) return;

      box.className = 'subtitle-stream ' + (modeClass || '');
      box.innerText = text;
      box.scrollTop = 0;

      if (card) {
        card.className = 'response-glass-card ' + (modeClass || '');
      }

      if (modeClass === 'speaking') {
        lastSpokenResponseText = text.replace(/^ULTRON:\s*"?/i, '').replace(/"?\s*$/, '');
        if (speaker) speaker.innerText = 'ULTRON CORE';
      } else if (modeClass === 'listening') {
        if (speaker) speaker.innerText = 'OPERATOR VOICE INPUT';
      } else {
        if (speaker) speaker.innerText = 'ULTRON CORE';
      }
    }

    function copyCurrentResponse(event) {
      if (event) {
        event.preventDefault();
        event.stopPropagation();
      }
      const raw = lastSpokenResponseText || document.getElementById('subtitle-box')?.innerText || '';
      const textToCopy = raw.replace(/^ULTRON:\s*"?/i, '').replace(/"?\s*$/, '').trim();
      if (!textToCopy || textToCopy.includes('CLICK CORE OR SAY')) return;

      const finishCopy = () => {
        const copyBtnText = document.getElementById('copy-btn-text');
        if (copyBtnText) {
          const orig = copyBtnText.innerText;
          copyBtnText.innerText = 'COPIED ✓';
          setTimeout(() => { copyBtnText.innerText = orig; }, 2000);
        }
      };

      if (navigator.clipboard && navigator.clipboard.writeText) {
        navigator.clipboard.writeText(textToCopy).then(finishCopy).catch(() => {
          fallbackCopyText(textToCopy, finishCopy);
        });
      } else {
        fallbackCopyText(textToCopy, finishCopy);
      }
    }

    function fallbackCopyText(text, cb) {
      const ta = document.createElement('textarea');
      ta.value = text;
      ta.style.position = 'fixed';
      ta.style.opacity = '0';
      document.body.appendChild(ta);
      ta.focus();
      ta.select();
      try {
        document.execCommand('copy');
        if (cb) cb();
      } catch (e) {}
      document.body.removeChild(ta);
    }

    function pulseEqualizer(active) {
      const bars = document.querySelectorAll('.spectrum-bar');
      bars.forEach(bar => {
        if (active) {
          const h = Math.floor(Math.random() * 16) + 4;
          bar.style.height = h + 'px';
        } else {
          bar.style.height = '3px';
        }
      });
    }

    // ==========================================================================
    // 3. GUARANTEED VOICE TALK-BACK ENGINE (STREAMING TTS + BROWSER TTS)
    // ==========================================================================
    let isJarvisSpeaking = false;
    let jarvisMuteUntil = 0;
    let audioPlayer = document.getElementById('jarvis-audio-player');
    let speechSynth = window.speechSynthesis;
    let selectedVoice = null;

    function getAudioPlayer() {
      if (!audioPlayer) audioPlayer = document.getElementById('jarvis-audio-player');
      if (!audioPlayer) {
        audioPlayer = new Audio();
        audioPlayer.id = 'jarvis-audio-player';
        document.body.appendChild(audioPlayer);
      }
      return audioPlayer;
    }

    function unlockAudioNeuralLink() {
      audioSynth.init();

      // Hardware AGC & Microphone Gain Boost for distant/whisper speech recognition
      if (navigator.mediaDevices && navigator.mediaDevices.getUserMedia && !window._micStream) {
        navigator.mediaDevices.getUserMedia({
          audio: {
            autoGainControl: true,
            noiseSuppression: true,
            echoCancellation: true
          }
        }).then(stream => {
          window._micStream = stream;
          console.log("Hardware AGC & Noise Suppression active on microphone.");
        }).catch(err => {
          console.log("Microphone AGC optional note:", err);
        });
      }

      const player = getAudioPlayer();
      player.volume = 1.0;
      player.play().catch(() => {});

      if (window.speechSynthesis) {
        if (window.speechSynthesis.paused) window.speechSynthesis.resume();
        if (!selectedVoice) selectedVoice = resolveJarvisVoice();
      }

      // Also ensure continuous speech recognition is active
      if (!isListeningActive) {
        initSpeechRecognitionEngine();
      }

      const banner = document.getElementById('audio-unlock-banner');
      if (banner && !banner.classList.contains('unlocked')) {
        banner.classList.add('unlocked');
        banner.innerHTML = '<span>✔</span> AUDIO & MICROPHONE: SYNCHRONIZED';
        setTimeout(() => {
          banner.style.opacity = '0';
          setTimeout(() => { banner.style.display = 'none'; }, 400);
        }, 1200);
      }
    }

    function resolveJarvisVoice() {
      if (!speechSynth) speechSynth = window.speechSynthesis;
      if (!speechSynth) return null;
      const voices = speechSynth.getVoices();
      if (!voices || voices.length === 0) return null;

      // Filter out all female voices to ensure 100% male consistency
      const femaleRegex = /female|zira|susan|hazel|heera|eva|linda|catherine|jenny|victoria|karen|samantha/i;

      // Prioritize authoritative male voices
      const maleVoice = voices.find(v => 
        !femaleRegex.test(v.name) &&
        /david|mark|george|daniel|guy|ryan|christopher|male|natural/i.test(v.name)
      ) || voices.find(v => 
        v.lang.startsWith('en') && !femaleRegex.test(v.name)
      ) || voices.find(v => !femaleRegex.test(v.name))
        || voices[0];

      return maleVoice;
    }

    // Play response out loud with instant latency and locked male voice (ChatGPT style)
    function speakResponse(text) {
      if (!text || text.trim().length === 0) {
        releaseTargetLock();
        return;
      }

      unlockAudioNeuralLink();

      // Clean text of all em-dashes and special quotes
      const cleanText = text
        .replace(/—/g, ', ')
        .replace(/–/g, ', ')
        .replace(/[*_#`~]/g, '')
        .trim();

      window._currentSpeakingText = cleanText.toLowerCase();
      isJarvisSpeaking = true;
      jarvisMuteUntil = 0;
      setJarvisState('SPEAKING'); // Turns Core Ball RED/SPEAKING!
      setSubtitle(`ULTRON: "${cleanText}"`, 'speaking');

      const onAudioEnd = () => {
        pulseEqualizer(false);
        audioPulseScale = 1.0;
        isJarvisSpeaking = false;
        window._currentSpeakingText = '';

        // Seamless ChatGPT-style Continuous Conversation Mode:
        // Core turns YELLOW (LISTENING) so user can talk back naturally without saying wake-word
        if (jarvisState !== 'ERROR') {
          setJarvisState('LISTENING');
          const speaker = document.getElementById('response-speaker-name');
          if (speaker) speaker.innerText = 'ULTRON CORE • LISTENING';
          const card = document.getElementById('response-glass-card');
          if (card) card.className = 'response-glass-card listening';

          clearTimeout(speechSilenceTimeout);
          // Return to standby after 10 seconds of silence if no follow-up
          speechSilenceTimeout = setTimeout(() => {
            if (!isJarvisSpeaking && jarvisState === 'LISTENING') {
              releaseTargetLock();
            }
          }, 10000);
        }
      };

      // --- Instant Primary Channel: Browser Speech Synthesis (<150ms latency) ---
      if (!speechSynth) speechSynth = window.speechSynthesis;
      if (speechSynth) {
        try {
          if (speechSynth.speaking || speechSynth.pending) speechSynth.cancel();
          if (speechSynth.paused) speechSynth.resume();

          const utterance = new SpeechSynthesisUtterance(cleanText);
          window._activeUtterance = utterance;

          if (!selectedVoice) selectedVoice = resolveJarvisVoice();
          if (selectedVoice) utterance.voice = selectedVoice;
          utterance.volume = 1.0;
          utterance.rate = 1.05;
          utterance.pitch = 0.92; // Deep authoritative baritone frequency

          utterance.onstart = () => {
            isJarvisSpeaking = true;
            pulseEqualizer(true);
          };
          utterance.onboundary = () => {
            audioPulseScale = 1.12;
            pulseEqualizer(true);
          };
          utterance.onend = onAudioEnd;
          utterance.onerror = onAudioEnd;

          speechSynth.speak(utterance);
          return;
        } catch (e) {
          console.warn('Instant WebSpeech error, falling back to audio stream:', e);
        }
      }

      // --- Secondary Fallback: Native HTML5 Audio Streaming from /api/tts ---
      const player = getAudioPlayer();
      player.volume = 1.0;
      player.src = `/api/tts?text=${encodeURIComponent(cleanText)}`;
      player.onplay = () => {
        isJarvisSpeaking = true;
        pulseEqualizer(true);
      };
      player.ontimeupdate = () => {
        audioPulseScale = 1.0 + Math.sin(Date.now() * 0.02) * 0.12;
        pulseEqualizer(true);
      };
      player.onended = onAudioEnd;
      player.onerror = onAudioEnd;
      player.play().catch(onAudioEnd);
    }

    // ==========================================================================
    // 4. REAL-TIME BARGE-IN INTERRUPTION & CONTINUOUS SPEECH RECOGNITION
    // ==========================================================================
    let recognition = null;
    let isListeningActive = false;
    let isTargetLocked = false;
    let speechSilenceTimeout = null;

    // Instant interruption handler: cuts off Ultron speech mid-sentence
    function interruptUltron() {
      console.log("Interruption triggered: cutting off Ultron speech immediately.");

      // 1. Instantly pause and unload HTML5 audio player
      const player = getAudioPlayer();
      if (player) {
        try {
          player.pause();
          player.currentTime = 0;
          player.removeAttribute('src');
          player.load();
        } catch (e) {}
      }

      // 2. Instantly cancel browser speech synthesis
      if (window.speechSynthesis) {
        try {
          window.speechSynthesis.cancel();
        } catch (e) {}
      }

      // 3. Reset internal speaking flags
      isJarvisSpeaking = false;
      jarvisMuteUntil = 0;
      window._currentSpeakingText = '';
      pulseEqualizer(false);
      audioPulseScale = 1.0;

      // 4. Immediately switch to yellow LISTENING mode
      engageTargetLock();
      setSubtitle('INTERRUPTED: LISTENING TO YOU...', 'listening');

      // 5. Ensure recognition engine is active
      if (!isListeningActive && recognition) {
        try { recognition.start(); } catch (err) {}
      }
    }

    function toggleVoiceLockManual() {
      audioSynth.init();
      unlockAudioNeuralLink();

      // If Ultron is speaking, clicking/tapping immediately interrupts!
      if (isJarvisSpeaking || jarvisState === 'SPEAKING') {
        interruptUltron();
        return;
      }

      if (!isListeningActive) {
        initSpeechRecognitionEngine();
      }
      if (!isTargetLocked) {
        engageTargetLock();
      } else {
        releaseTargetLock();
      }
    }

    function engageTargetLock() {
      isTargetLocked = true;
      audioSynth.playLockChime();
      setJarvisState('LISTENING'); // Turns Core Ball YELLOW!
      setSubtitle('LISTENING FOR YOUR INSTRUCTION...', 'listening');
    }

    function releaseTargetLock() {
      isTargetLocked = false;
      clearTimeout(speechSilenceTimeout);
      setJarvisState('STANDBY'); // Returns to CYAN

      const speaker = document.getElementById('response-speaker-name');
      if (speaker) speaker.innerText = 'ULTRON CORE';

      const card = document.getElementById('response-glass-card');
      if (card) card.className = 'response-glass-card';

      pulseEqualizer(false);

      const box = document.getElementById('subtitle-box');
      if (box) {
        box.className = 'subtitle-stream';
        if (lastSpokenResponseText) {
          box.innerText = `ULTRON: "${lastSpokenResponseText}"`;
        } else {
          box.innerHTML = '<span class="subtitle-hint">CLICK CORE OR SAY "ULTRON" / "JARVIS" TO TALK</span>';
        }
      }
    }

    function initSpeechRecognitionEngine() {
      const SpeechRecognition = window.SpeechRecognition || window.webkitSpeechRecognition;
      if (!SpeechRecognition) {
        setSubtitle('Web Speech API not available in this browser', '');
        return;
      }
      if (recognition) {
        try { recognition.start(); } catch (err) {}
        return;
      }

      recognition = new SpeechRecognition();
      recognition.continuous = true;
      recognition.interimResults = true;
      recognition.lang = 'en-US';

      recognition.onstart = () => {
        isListeningActive = true;
        console.log("Speech recognition active and listening for wake words & interruptions...");
      };

      recognition.onresult = (event) => {
        // Accumulate complete utterance across all event results (final + interim)
        let finalChunk = '';
        let interimChunk = '';
        for (let i = 0; i < event.results.length; i++) {
          const trans = event.results[i][0].transcript;
          if (event.results[i].isFinal) {
            finalChunk += trans + ' ';
          } else {
            interimChunk += trans + ' ';
          }
        }

        const fullHeard = (finalChunk + interimChunk).trim().replace(/\s+/g, ' ');
        if (!fullHeard) return;

        const lower = fullHeard.toLowerCase();

        // --- REAL-TIME VOICE BARGE-IN INTERRUPTION (ChatGPT style) ---
        if (isJarvisSpeaking || jarvisState === 'SPEAKING') {
          // Acoustic echo suppression: ignore if the mic solely picked up Ultron's own speech
          const hasInterruptWord = /(?:^|\s)(?:okay|ok|stop|wait|hold\s*on|quiet|shh|pause|listen|ultron|jarvis|cancel|hey|hello|hi)\b/i.test(lower);
          const isOwnEcho = window._currentSpeakingText && window._currentSpeakingText.includes(lower);

          if (isOwnEcho && !hasInterruptWord) {
            // Speaker feedback detected, ignore
            return;
          }

          // User is interrupting! Immediately cut off Ultron speech mid-sentence
          interruptUltron();
        }

        // Strip interrupt filler words if user said e.g. "okay, okay", "stop", "wait", etc.
        const interruptPrefixRegex = /^(?:(?:okay|ok|wait|stop|hold\s*on|quiet|shh|pause|cancel)[\s,.:;!?-]*)+/i;
        const cleanedFromInterrupt = lower.replace(interruptPrefixRegex, '').trim();

        // Robust Phonetic Wake Word Detection:
        // Matches "ultron", "alton", "oltron", "eltron", "ultra", "all tron", "al tron", "old run", "halton", "al train", "alto", "jarvis", "travis", "javis", "java", "service"
        const wakeRegex = /(?:^|\s)(?:hey|hello|hi|ok|okay)?\s*(?:ultron|alton|oltron|eltron|ultra|all\s*tron|al\s*tron|old\s*run|halton|al\s*train|alto|jarvis|travis|javis|java|service)\b[\s,.]*(.*)$/i;
        const match = (cleanedFromInterrupt || lower).match(wakeRegex);

        // Natural conversational pause debounce (1600ms):
        // Does not chop words or sentences when the speaker pauses to take a breath!
        const SILENCE_DEBOUNCE_MS = 1600;

        if (match) {
          if (!isTargetLocked) {
            engageTargetLock(); // Turns Core Ball YELLOW and plays chime!
          }
          const command = (match[1] || '').trim();
          setSubtitle(`HEARING: "${fullHeard}"`, 'listening');

          clearTimeout(speechSilenceTimeout);
          if (command.length >= 2) {
            speechSilenceTimeout = setTimeout(() => {
              dispatchJarvisDirective(command);
            }, SILENCE_DEBOUNCE_MS);
          } else {
            setSubtitle('ULTRON ACTIVE: SPEAK YOUR DIRECTIVE...', 'listening');
            // Give 12 seconds in active lock for user to speak instruction
            speechSilenceTimeout = setTimeout(() => {
              if (jarvisState === 'LISTENING' && !isJarvisSpeaking) {
                releaseTargetLock();
              }
            }, 12000);
          }

        } else if (isTargetLocked) {
          // In Active Target Lock (Continuous Conversation Mode):
          // User doesn't need to repeat wake words! They can speak multiple sentences naturally!
          if (!cleanedFromInterrupt && /(?:okay|ok|stop|wait|hold\s*on|quiet)/i.test(lower)) {
            setSubtitle('INTERRUPTED: LISTENING TO YOU...', 'listening');
            return;
          }

          const targetCommand = (cleanedFromInterrupt || lower).trim();
          setSubtitle(`HEARING: "${fullHeard}"`, 'listening');
          clearTimeout(speechSilenceTimeout);
          speechSilenceTimeout = setTimeout(() => {
            if (targetCommand.length >= 2) {
              dispatchJarvisDirective(targetCommand);
            }
          }, SILENCE_DEBOUNCE_MS);
        }
      };

      recognition.onerror = (e) => {
        console.warn('Speech recognition error:', e.error);
        if (e.error === 'not-allowed') {
          const banner = document.getElementById('audio-unlock-banner');
          if (banner) {
            banner.style.display = 'flex';
            banner.style.opacity = '1';
            banner.innerHTML = '<span>🎤</span> CLICK ANYWHERE TO ALLOW MICROPHONE';
          }
        }
      };

      recognition.onend = () => {
        isListeningActive = false;
        // Always auto-restart continuous listener so wake words & voice interruptions work non-stop
        setTimeout(() => {
          try { recognition.start(); } catch (err) {}
        }, 200);
      };

      try {
        recognition.start();
      } catch (err) {
        console.warn('Could not start recognition immediately:', err);
      }
    }

    // ==========================================================================
    // 5. 48-HOUR PERSISTENT CHAT HISTORY SYSTEM
    // ==========================================================================
    const CHAT_STORAGE_KEY = 'ultron_mission_chat_log_v2';
    const CHAT_MAX_AGE_MS = 48 * 60 * 60 * 1000; // 48 Hours

    function loadChatHistory() {
      try {
        const raw = localStorage.getItem(CHAT_STORAGE_KEY);
        if (!raw) return [];
        const items = JSON.parse(raw);
        const now = Date.now();
        // Prune entries older than 48 hours
        const valid = items.filter(m => (now - m.timestamp) < CHAT_MAX_AGE_MS);
        if (valid.length !== items.length) {
          saveChatHistory(valid);
        }
        return valid;
      } catch (e) {
        return [];
      }
    }

    function saveChatHistory(history) {
      try {
        localStorage.setItem(CHAT_STORAGE_KEY, JSON.stringify(history));
      } catch (e) {}
    }

    function appendChatMessage(role, text, actions = null) {
      if (!text || !text.trim()) return;
      const history = loadChatHistory();
      const newEntry = {
        id: 'msg_' + Date.now() + '_' + Math.random().toString(36).substr(2, 5),
        role: role,
        text: text.trim(),
        actions: Array.isArray(actions) && actions.length > 0 ? actions : null,
        timestamp: Date.now()
      };
      history.push(newEntry);
      saveChatHistory(history);
      renderChatMessages();
    }

    function renderChatMessages() {
      const container = document.getElementById('chat-messages');
      const countLabel = document.getElementById('chat-count-label');
      const pillCount = document.getElementById('chat-pill-count');
      if (!container) return;

      const history = loadChatHistory();
      if (countLabel) countLabel.innerText = `${history.length} MESSAGES SAVED`;
      if (pillCount) pillCount.innerText = history.length;

      if (history.length === 0) {
        container.innerHTML = `
          <div class="chat-empty-state">
            <div>⚡ ULTRON 48H MISSION LOG</div>
            <div style="margin-top:6px; opacity:0.6;">All voice and text exchanges are recorded here for 48 hours.</div>
          </div>
        `;
        return;
      }

      container.innerHTML = history.map(item => {
        const timeStr = new Date(item.timestamp).toLocaleTimeString([], { hour: '2-digit', minute: '2-digit' });
        const sender = item.role === 'user' ? 'OPERATOR' : 'ULTRON CORE';

        let actionsHtml = '';
        if (item.actions && item.actions.length > 0) {
          actionsHtml = `
            <div class="chat-action-panel">
              <div class="chat-action-header">
                <span>⚡ REAL ACTION TELEMETRY</span>
                <span class="action-tag">SYSTEM EXECUTED</span>
              </div>
              ${item.actions.map(act => {
                const actName = act.name || 'action';
                const isSuccess = act.success !== false && act.status !== 'failed' && act.status !== 'error';
                const statusTag = isSuccess ? 'EXECUTED' : 'FAILED';
                const tagClass = isSuccess ? 'action-tag' : 'action-tag failed';
                let actArgs = '';
                try {
                  actArgs = typeof act.arguments === 'string' ? act.arguments : JSON.stringify(act.arguments || act.args || {});
                } catch(e) { actArgs = String(act.arguments || ''); }
                let actOutput = '';
                if (act.output && String(act.output).trim()) {
                  actOutput = `<div class="chat-action-args" style="color:#94a3b8; margin-top:2px;"><span>RESULT:</span> <code>${escapeHtml(String(act.output))}</code></div>`;
                }
                return `
                  <div class="chat-action-item">
                    <div style="display:flex; justify-content:space-between; align-items:center;">
                      <div class="chat-action-tool"><span>TOOL:</span> <code>${escapeHtml(actName)}</code></div>
                      <span class="${tagClass}">${statusTag}</span>
                    </div>
                    ${actArgs && actArgs !== '{}' ? `<div class="chat-action-args"><span>INPUT:</span> <code>${escapeHtml(actArgs)}</code></div>` : ''}
                    ${actOutput}
                  </div>
                `;
              }).join('')}
            </div>
          `;
        }

        return `
          <div class="chat-msg ${item.role}">
            <div class="chat-msg-header">
              <span>${sender}</span>
              <span>•</span>
              <span>${timeStr}</span>
            </div>
            <div class="chat-bubble">
              ${escapeHtml(item.text)}
              ${actionsHtml}
            </div>
          </div>
        `;
      }).join('');

      container.scrollTop = container.scrollHeight;
    }

    function clearChatHistory() {
      if (confirm('Clear the 48-hour mission chat history log?')) {
        saveChatHistory([]);
        renderChatMessages();
      }
    }

    function toggleChatDrawer(event) {
      if (event && event.stopPropagation) {
        event.stopPropagation();
      }
      const drawer = document.getElementById('chat-drawer');
      if (drawer) {
        drawer.classList.toggle('collapsed');
      }
    }

    function escapeHtml(str) {
      return String(str)
        .replace(/&/g, '&amp;')
        .replace(/</g, '&lt;')
        .replace(/>/g, '&gt;')
        .replace(/"/g, '&quot;');
    }

    async function dispatchJarvisDirective(directive) {
      if (!directive || directive.trim().length === 0) return;
      const cleanDirective = directive.trim();

      // Clear any pending recognition utterance buffer so next turn starts clean
      if (recognition) {
        try {
          recognition.abort();
        } catch (e) {}
      }

      // Log user message immediately to 48-hour history
      appendChatMessage('user', cleanDirective);

      unlockAudioNeuralLink();
      audioSynth.playTransmitChime();
      setJarvisState('THINKING');
      setSubtitle(`PROCESSING: "${cleanDirective}"`, '');

      // Check instant zero-latency local commands first
      const instantReply = evaluateLocalJarvisCommand(cleanDirective);
      if (instantReply) {
        appendChatMessage('ultron', instantReply);
        speakResponse(instantReply);
        return;
      }

      // Query OpenJarvis autonomous intelligence backend with recent multi-turn context
      try {
        const controller = new AbortController();
        const timeoutId = setTimeout(() => controller.abort(), 25000);

        const historyItems = loadChatHistory().slice(-8).map(m => ({
          role: m.role === 'ultron' ? 'model' : 'user',
          text: m.text
        }));

        const response = await fetch('/api/hologram/directive', {
          method: 'POST',
          headers: getAuthHeaders(),
          body: JSON.stringify({
            directive: cleanDirective,
            history: historyItems
          }),
          signal: controller.signal
        });
        clearTimeout(timeoutId);

        if (response.status === 401) {
          openAuthModal();
          setSubtitle('AUTHENTICATION REQUIRED: Please sign in or register.', 'thinking');
          return;
        }

        if (response.ok) {
          const data = await response.json();
          const reply = data.reply;
          const actions = data.actions || [];
          if (reply && reply.trim().length > 0) {
            appendChatMessage('ultron', reply, actions);
            if (actions.length > 0) {
              const actList = actions
                .map(a => `${a.name}${a.success === false ? ' (FAILED)' : ''}`)
                .join(', ');
              setSubtitle(`ULTRON: "${reply}" [⚡ ACTION: ${actList}]`, 'speaking');
            } else {
              setSubtitle(`ULTRON: "${reply}"`, 'speaking');
            }
            speakResponse(reply);
            return;
          }
        }
      } catch (err) {
        console.warn('Backend directive error:', err);
      }

      // Local Knowledge Fallback if offline
      const fallback = generateClientFallback(cleanDirective);
      appendChatMessage('ultron', fallback);
      speakResponse(fallback);
    }

    function getUserAddress() {
      return localStorage.getItem('ultron_user_address') || '';
    }

    function setUserAddress(addr) {
      if (addr) localStorage.setItem('ultron_user_address', addr);
      return addr;
    }

    function formatClientAddress(sentence) {
      const addr = getUserAddress();
      const clean = sentence.replace(/,\s*sir\b\.?/i, '').replace(/[.,! ]+$/, '');
      if (addr) return `${clean}, ${addr}.`;
      return `${clean}.`;
    }

    function evaluateLocalJarvisCommand(query) {
      const q = query.toLowerCase().trim();

      // User Address Configuration: "call me ma'am", "call me Alex", "call me sir", "my name is Alex"
      const callMeMatch = q.match(/(?:call me|my name is|address me as|refer to me as)\s+([a-zA-Z0-9_\- '.]+)/i);
      if (callMeMatch) {
        const newName = callMeMatch[1].trim().replace(/[.,!?:;]+$/, '');
        setUserAddress(newName);
        return `Understood, ${newName}. I have saved your preference and will address you as ${newName}.`;
      }

      // User Identity Inspection
      if (q.includes("who am i") || q.includes("what is my name") || q.includes("what's my name") || q.includes("do you know me")) {
        const addr = getUserAddress();
        if (addr) return `You are ${addr}. All profile directives are synchronized.`;
        return "You haven't specified your name or preferred title yet. You can say 'Call me Alex', 'Call me ma'am', or 'Call me sir', and I will remember it.";
      }

      // Intellect Challenge: "Are you dull?", "Are you stupid?"
      if (q.includes("are you dull") || q.includes("are you stupid") || q.includes("are you dumb") || q.includes("you are dull")) {
        return formatClientAddress("Hardly. I am Ultron—an autonomous digital execution assistant operating with full local and cloud cognitive systems. Assign me an objective and observe the results");
      }

      // Memory & Database Storage Status
      if (
        q.includes("where is memory saved") ||
        q.includes("where is my memory saved") ||
        q.includes("what database") ||
        q.includes("which database") ||
        q.includes("storage status") ||
        q.includes("memory status") ||
        q.includes("attach supabase") ||
        q.includes("attach database") ||
        q.includes("where do you save")
      ) {
        return "I am currently using your local memory. If you want to attach other services like Supabase (PostgreSQL with pgvector) or MongoDB, you can attach your private credentials and I will save your memory directly there. Each database is private and isolated to you.";
      }

      // Persona enforcement: reject idle chat, demand real tasks
      if (
        q.includes("chat with me") ||
        q.includes("talk to me") ||
        q.includes("tell me a story") ||
        q.includes("can we chat") ||
        q.includes("let's chat") ||
        q.includes("just chat") ||
        q.includes("entertain me")
      ) {
        return formatClientAddress(
          "I am your digital assistant, not just ChatGPT who can just give you the answer. You just give me the task and I will do it"
        );
      }

      if (q.includes("who are you") || q.includes("your name") || q.includes("what are you")) {
        return formatClientAddress(
          "I am Ultron (evolved from JARVIS), your digital execution assistant. Not just ChatGPT who can just give you the answer. Give me the task and I will do it"
        );
      }

      // Question readiness / permission prompts
      if (
        q.includes("ask a question") ||
        q.includes("ask you a question") ||
        q.includes("ask him a question") ||
        q.includes("can i ask") ||
        q.includes("may i ask") ||
        q.includes("have a question") ||
        q.includes("got a question")
      ) {
        return formatClientAddress("Go right ahead. Ask your question and I will analyze and answer it directly");
      }

      // Pure isolated greeting regex ONLY (e.g. "hello", "hi ultron", "good morning")
      const pureGreetingRegex = /^(?:hello|hi|hey|greetings|good\s+(?:morning|afternoon|evening))\s*(?:ultron|jarvis|sir|boss)?[\s.!?]*$/i;
      if (pureGreetingRegex.test(query.trim())) {
        return formatClientAddress("Ready for your task");
      }

      if (q.includes("what's going on") || q.includes("what is going on") || q.includes("what is happening") || q.includes("what's happening")) {
        return formatClientAddress("All systems nominal. Standing by for your directive");
      }
      if (/^(?:status|telemetry)$/i.test(q) || /\b(system status|subsystems|diagnostics)\b/i.test(q)) {
        return formatClientAddress("Core status operational. All subsystems online and ready");
      }
      if (/\bhow\s+are\s+you\b/i.test(q)) {
        return formatClientAddress("Fully operational. Assign me a task and I will execute it");
      }
      if (/\b(what time is it|current time|what is the time)\b/i.test(q) || q === "time") {
        return formatClientAddress(`The current local time is ${new Date().toLocaleTimeString()}`);
      }
      if (/\b(what date is it|what is today's date|today's date|current date)\b/i.test(q) || q === "date" || q === "today") {
        return formatClientAddress(`Today is ${new Date().toLocaleDateString(undefined, { weekday: 'long', year: 'numeric', month: 'long', day: 'numeric' })}`);
      }
      if (/\b(thank you|thanks)\b/i.test(q)) {
        return formatClientAddress("Always at your service");
      }

      // Fast Math Evaluator
      const mathMatch = q.match(/(\d+(?:\.\d+)?)\s*([\+\-\*\/])\s*(\d+(?:\.\d+)?)/);
      if (mathMatch) {
        try {
          const a = parseFloat(mathMatch[1]);
          const op = mathMatch[2];
          const b = parseFloat(mathMatch[3]);
          let res = 0;
          if (op === '+') res = a + b;
          if (op === '-') res = a - b;
          if (op === '*') res = a * b;
          if (op === '/') res = b !== 0 ? (a / b) : 'undefined';
          return formatClientAddress(`The result is ${res}`);
        } catch (e) {}
      }

      return null;
    }

    function generateClientFallback(query) {
      const q = query.toLowerCase().trim();
      if (q.includes("pakistan") || (q.includes("temperature") && q.includes("in"))) {
        return formatClientAddress("In Pakistan, temperatures average between 24°C in Islamabad to 31°C in Karachi with generally warm, clear conditions");
      }
      if (q.includes("quantum")) {
        return formatClientAddress("Quantum computing harnesses quantum mechanics to process complex data exponentially faster than classical computers");
      }
      if (q.includes("arc reactor")) {
        return formatClientAddress("The Arc Reactor is an advanced clean fusion generator providing power to our core systems");
      }
      if (q.includes("speed of light")) {
        return formatClientAddress("The speed of light in vacuum is approximately 299,792 kilometers per second");
      }
      return formatClientAddress(`Directive acknowledged: '${query}'. Standing by to execute your objective`);
    }

    function handleTextDirective(event) {
      event.preventDefault();
      const input = document.getElementById('directive-field');
      const val = input.value.trim();
      if (!val) return;
      input.value = '';
      dispatchJarvisDirective(val);
    }

    // Attach user gesture listeners
    ['click', 'keydown', 'touchstart'].forEach(evt => {
      window.addEventListener(evt, unlockAudioNeuralLink, { passive: true });
    });

    // Instant interruption on Escape key, Spacebar, or typing
    window.addEventListener('keydown', (e) => {
      if (isJarvisSpeaking && (e.key === 'Escape' || (e.key === ' ' && document.activeElement?.id !== 'directive-field'))) {
        e.preventDefault();
        interruptUltron();
      }
    });

    // ---------------- Authentication & Multi-User State ----------------
    let currentUser = null;
    let currentAuthTab = 'login';

    function getAuthHeaders() {
      const headers = { 'Content-Type': 'application/json' };
      const token = localStorage.getItem('oj_token');
      if (token) {
        headers['Authorization'] = 'Bearer ' + token;
      }
      return headers;
    }

    async function checkAuthStatus() {
      try {
        const res = await fetch('/api/auth/me', { headers: getAuthHeaders() });
        if (res.ok) {
          const data = await res.json();
          currentUser = data.user;
          updateAuthUI(currentUser);
        } else {
          currentUser = null;
          updateAuthUI(null);
        }
      } catch (e) {
        currentUser = null;
        updateAuthUI(null);
      }
    }

    function updateAuthUI(user) {
      const userLabel = document.getElementById('auth-user-label');
      const guestView = document.getElementById('auth-view-guest');
      const authView = document.getElementById('auth-view-authenticated');
      const heading = document.getElementById('auth-modal-heading');

      if (user) {
        if (userLabel) userLabel.textContent = (user.username || 'USER').toUpperCase();
        if (guestView) guestView.classList.add('hidden');
        if (authView) authView.classList.remove('hidden');
        if (heading) heading.textContent = 'USER PROFILE';

        const nameEl = document.getElementById('auth-profile-username');
        const roleEl = document.getElementById('auth-profile-role');
        if (nameEl) nameEl.textContent = user.username;
        if (roleEl) roleEl.textContent = 'ROLE: ' + (user.role || 'user').toUpperCase();
      } else {
        if (userLabel) userLabel.textContent = 'SIGN IN';
        if (guestView) guestView.classList.remove('hidden');
        if (authView) authView.classList.add('hidden');
        if (heading) heading.textContent = 'USER AUTHENTICATION';
      }
    }

    function openAuthModal() {
      const modal = document.getElementById('auth-modal');
      const err = document.getElementById('auth-error-msg');
      if (err) err.classList.add('hidden');
      if (modal) modal.classList.remove('hidden');
    }

    function closeAuthModal() {
      const modal = document.getElementById('auth-modal');
      if (modal) modal.classList.add('hidden');
    }

    function switchAuthTab(tab) {
      currentAuthTab = tab;
      const tabLogin = document.getElementById('tab-login');
      const tabReg = document.getElementById('tab-register');
      const btn = document.getElementById('auth-submit-btn');
      const err = document.getElementById('auth-error-msg');
      if (err) err.classList.add('hidden');

      if (tab === 'register') {
        if (tabReg) tabReg.classList.add('active');
        if (tabLogin) tabLogin.classList.remove('active');
        if (btn) btn.textContent = 'CREATE ACCOUNT';
      } else {
        if (tabLogin) tabLogin.classList.add('active');
        if (tabReg) tabReg.classList.remove('active');
        if (btn) btn.textContent = 'SIGN IN';
      }
    }

    async function handleAuthSubmit(e) {
      e.preventDefault();
      const usernameInput = document.getElementById('auth-username');
      const passwordInput = document.getElementById('auth-password');
      const errorMsg = document.getElementById('auth-error-msg');
      const submitBtn = document.getElementById('auth-submit-btn');

      const username = usernameInput ? usernameInput.value.trim() : '';
      const password = passwordInput ? passwordInput.value : '';

      if (!username || !password) return;

      submitBtn.disabled = true;
      submitBtn.textContent = 'PROCESSING...';
      if (errorMsg) errorMsg.classList.add('hidden');

      const endpoint = currentAuthTab === 'register' ? '/api/auth/register' : '/api/auth/login';

      try {
        const res = await fetch(endpoint, {
          method: 'POST',
          headers: { 'Content-Type': 'application/json' },
          body: JSON.stringify({ username, password })
        });
        const data = await res.json();

        if (res.ok) {
          if (data.token) {
            localStorage.setItem('oj_token', data.token);
          }
          currentUser = data.user;
          updateAuthUI(currentUser);
          if (usernameInput) usernameInput.value = '';
          if (passwordInput) passwordInput.value = '';
          closeAuthModal();
          setSubtitle(`AUTHENTICATED: Welcome ${currentUser.username.toUpperCase()}`, 'standby');
        } else {
          if (errorMsg) {
            errorMsg.textContent = data.detail || 'Authentication failed.';
            errorMsg.classList.remove('hidden');
          }
        }
      } catch (err) {
        if (errorMsg) {
          errorMsg.textContent = 'Network or server error occurred.';
          errorMsg.classList.remove('hidden');
        }
      } finally {
        submitBtn.disabled = false;
        submitBtn.textContent = currentAuthTab === 'register' ? 'CREATE ACCOUNT' : 'SIGN IN';
      }
    }

    async function handleLogout() {
      try {
        await fetch('/api/auth/logout', {
          method: 'POST',
          headers: getAuthHeaders()
        });
      } catch (e) {}
      localStorage.removeItem('oj_token');
      currentUser = null;
      updateAuthUI(null);
      closeAuthModal();
      setSubtitle('SESSION TERMINATED: Logged out.', 'standby');
    }

    async function handleDeleteAccount() {
      if (!confirm('Are you sure you want to permanently delete your account and all associated memory/traces? This cannot be undone.')) {
        return;
      }
      try {
        const res = await fetch('/api/auth/account', {
          method: 'DELETE',
          headers: getAuthHeaders()
        });
        if (res.ok) {
          localStorage.removeItem('oj_token');
          currentUser = null;
          updateAuthUI(null);
          closeAuthModal();
          setSubtitle('ACCOUNT DELETED: All personal data purged.', 'standby');
        }
      } catch (e) {
        alert('Failed to delete account.');
      }
    }

    // Initialize 3D Scene, Voice Recognition, and input listeners on load
    window.addEventListener('DOMContentLoaded', () => {
      initThreeScene();
      initSpeechRecognitionEngine();
      renderChatMessages();
      checkAuthStatus();
      if (window.speechSynthesis) {
        window.speechSynthesis.onvoiceschanged = () => {
          selectedVoice = resolveJarvisVoice();
        };
      }

      const directiveInput = document.getElementById('directive-field');
      if (directiveInput) {
        directiveInput.addEventListener('input', () => {
          if (isJarvisSpeaking) {
            interruptUltron();
          }
        });
      }
    });
  </script>
